<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oddpot · 炉火旅厨造型工坊</title><style>
*{box-sizing:border-box}body{margin:0;background:#20312a;color:#f2e4c5;font:15px system-ui}main{max-width:760px;margin:auto;padding:18px 12px}a{color:#f1c77e}h1{font:normal 26px Georgia,serif;margin:12px 0}p{color:#d5c5a5;line-height:1.6}fieldset{border:0;padding:0;margin:12px 0;display:flex;gap:6px;flex-wrap:wrap}legend{font-size:13px;color:#d6c6a7;margin-bottom:6px}button{font:inherit;background:#34473a;color:#f4e5c6;border:1px solid #807657;border-radius:6px;padding:10px 12px;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#e5c58d;color:#26332b;border-color:#f8d99b}#stage{height:clamp(320px,62vh,540px);position:relative;overflow:hidden;border:1px solid #9b8965;border-radius:12px;background:#ac9c7e}canvas{width:100%;height:100%;display:block}#status{position:absolute;bottom:10px;left:10px;background:#26362c;color:#f1e5c8;padding:6px 10px;border-radius:5px;font-size:12px;pointer-events:none}footer{font-size:12px;color:#c5b99d;padding:14px 0}button:focus-visible,a:focus-visible{outline:2px solid #fff2c8;outline-offset:3px}
</style></head><body><main><a href="./?render=3d">返回游戏</a><h1>炉火旅厨 · 造型工坊</h1><p>同尺度、同光线、同镜头的真实程序化 3D 模型。默认静态，无武器；先验收剪影、脸、身体与服装，再做动作。Z2c9c 依据概念图与实景正面差异，重塑脸部、肩胸腰及帽发大形体；保留 Z2c9b 同条件对照。</p>
<fieldset id="models"><legend>模型对比</legend><button data-model="0" aria-pressed="false">Z2c5 基线</button><button data-model="1" aria-pressed="false">Z2c6 旅厨</button><button data-model="2" aria-pressed="false">Z2c7 造型候选</button><button data-model="3" aria-pressed="false">Z2c9 Kett 原版</button><button data-model="4" aria-pressed="false">Z2c9b Kett 精修</button><button data-model="5" aria-pressed="true">Z2c9c 大形体精修</button></fieldset>
<div id="stage"><div id="status" role="status">正在加载 3D 模型…</div></div>
<fieldset id="views"><legend>观察角度</legend><button data-angle="0" aria-pressed="true">正面</button><button data-angle="45" aria-pressed="false">3/4</button><button data-angle="90" aria-pressed="false">侧面</button><button data-angle="180" aria-pressed="false">背面</button></fieldset>
<fieldset><legend>姿势与尺寸</legend><button id="idle" aria-pressed="false">Idle</button><button id="close" aria-pressed="false">脸部近景</button><button id="small" aria-pressed="false">游戏小尺寸</button></fieldset><footer>不读写游戏存档。角色动作、装备握点和跨场景适配将在造型验收后另行验证。</footer></main>
<script type="module">
import {makeChefZ2c5} from './src/three_z2c5_chef_portrait.js';
import {makeChefZ2c6} from './src/three_z2c6_chef_portrait.js';
import {makeChefZ2c7} from './src/three_z2c7_chef_portrait.js';
import {makeChefZ2c9} from './src/three_z2c9_kett.js?v=z2c9';
import {makeChefZ2c9b} from './src/three_z2c9b_kett.js?v=z2c9b';
import {makeChefZ2c9c} from './src/three_z2c9c_kett.js?v=z2c9c';
import {roundedFactory} from './src/three_y1_models.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status');let selected=5,angle=0,idle=false,zoom=0,renderer,scene,camera,models=[],frame=0,start=0,dirty=true,disposed=false;
function press(scope,button){scope.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===button)))}
function refresh(){dirty=true;start=performance.now()/1000;if(!frame&&!document.hidden&&!disposed&&renderer)frame=requestAnimationFrame(draw)}
function select(i){selected=i;models.forEach((m,j)=>m.root.visible=j===i);refresh()}
document.querySelector('#models').addEventListener('click',e=>{if(!e.target.matches('[data-model]'))return;press(e.currentTarget,e.target);select(+e.target.dataset.model)});
document.querySelector('#views').addEventListener('click',e=>{if(!e.target.matches('[data-angle]'))return;press(e.currentTarget,e.target);angle=+e.target.dataset.angle;refresh()});
document.querySelector('#idle').onclick=e=>{idle=!idle;e.target.setAttribute('aria-pressed',String(idle));refresh()};
for(const [id,n] of [['close',1],['small',2]])document.getElementById(id).onclick=()=>{zoom=zoom===n?0:n;for(const [a,b] of [['close',1],['small',2]])document.getElementById(a).setAttribute('aria-pressed',String(zoom===b));refresh()};
function draw(now){frame=0;if(disposed||document.hidden||!renderer)return;const m=models[selected];if(!m)return;
 if(dirty||idle){const w=stage.clientWidth,h=stage.clientHeight;if(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio()))renderer.setSize(w,h,false);
 const aspect=w/h,extent=(zoom===1?.96:zoom===2?4.4:2.08);camera.top=extent/2;camera.bottom=-extent/2;camera.left=-extent/2*aspect;camera.right=extent/2*aspect;camera.updateProjectionMatrix();
 const a=angle*Math.PI/180,y=zoom===1?1.20:.85;camera.position.set(Math.sin(a)*4,y+(zoom===1?.08:.38),Math.cos(a)*4);camera.lookAt(0,y,0);
 m.update(idle?now/1000-start+1:1,'wok');m.root.rotation.y=idle?m.root.rotation.y:0;if(!idle){m.rig.body.rotation.z=0;m.rig.head.rotation.set(0,0,0)};m.rig.arms.forEach((o,i)=>{const k=i===0?-1:1;o.rotation.set(-.04,0,k*.22);m.rig.elbows[i].rotation.set(-.19,0,k*.03)});
 renderer.render(scene,camera);dirty=false;status.textContent=['Z2c5','Z2c6','Z2c7','Z2c9','Z2c9b','Z2c9c'][selected]+' · '+(idle?'Idle':'静态')+' · '+angle+'°';}
 if(idle)frame=requestAnimationFrame(draw)}
async function load(){let T;try{T=await import('https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js')}catch{T=await import('https://unpkg.com/three@0.170.0/build/three.module.js')};if(disposed)return;renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;stage.prepend(renderer.domElement);scene=new T.Scene();scene.background=new T.Color('#b6a78a');camera=new T.OrthographicCamera(-1,1,1,-1,.1,20);
 scene.add(new T.HemisphereLight('#fff2d3','#5e7469',2));const key=new T.DirectionalLight('#ffe0b5',3);key.position.set(-3,5,4);scene.add(key);const fill=new T.DirectionalLight('#d5e7ed',1.1);fill.position.set(4,3,-4);scene.add(fill);
 const round=roundedFactory(T);models=[makeChefZ2c5,makeChefZ2c6,makeChefZ2c7,makeChefZ2c9,makeChefZ2c9b,makeChefZ2c9c].map(fn=>fn(T,round));models.forEach(m=>scene.add(m.root));const base=new T.Mesh(new T.CylinderGeometry(.58,.61,.06,64),new T.MeshStandardMaterial({color:'#9a825c',roughness:.88}));base.position.y=-.015;scene.add(base);select(selected);
 new ResizeObserver(refresh).observe(stage)}
document.addEventListener('visibilitychange',()=>{if(document.hidden){cancelAnimationFrame(frame);frame=0}else refresh()});
window.addEventListener('pagehide',()=>{disposed=true;cancelAnimationFrame(frame);const g=new Set(),m=new Set();scene?.traverse(o=>{if(o.geometry)g.add(o.geometry);if(o.material)m.add(o.material)});g.forEach(x=>x.dispose());m.forEach(x=>x.dispose());renderer?.dispose()},{once:true});
load().catch(e=>{status.textContent='3D 加载失败：'+e.message;console.error(e)});
</script></body></html>
