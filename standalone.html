/* v0.2 Restaurant scene: a cozy, interactive, tile-based 2D room.

:root{background:#202b2b;color:#fff2d9}
body{background:linear-gradient(180deg,#203e3b 0%,#2b3128 75%,#1b2527 100%)}
.compact-stocks{border:1px dashed #74896e;border-radius:8px;color:#cad7ba;font-size:11px;padding:7px;margin:2px 0 8px}
.restaurant-frame{border:4px solid #634638;background:#bfa174;border-radius:16px;overflow:hidden;margin:12px 0;box-shadow:0 5px 0 #2b2422,0 12px 26px #0005;isolation:isolate}
.restaurant-scene{height:355px;position:relative;overflow:hidden;background:#c9a77c;font-family:ui-monospace,Menlo,Consolas,monospace;image-rendering:pixelated}
.room-wall{position:absolute;inset:0 0 auto;height:23%;background:repeating-linear-gradient(90deg,#d8bc8d 0 25px,#e8cb9b 25px 27px);border-bottom:13px solid #825b3c;display:flex;align-items:center;justify-content:space-around;box-shadow:0 7px 0 #a27a4d;z-index:0}

.scene-shelf{position:absolute;top:24%;left:4%;z-index:1;border-bottom:8px solid #986340;display:flex;gap:7px;padding:2px 4px;font-size:15px;filter:drop-shadow(2px 3px 0 #6d4b37)}
.scene-counter{position:absolute;top:43%;left:3%;width:94%;height:8%;background:#b77a45;border:4px solid #83522e;border-bottom:8px solid #683f2b;border-radius:4px;box-shadow:0 5px 0 #b58b59;z-index:1}
.scene-station{position:absolute;z-index:2;width:33%;height:23%;top:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:linear-gradient(#aa9980,#8f7d6c);border:4px solid #5b6260;border-bottom:8px solid #4a514f;color:#2b3131;border-radius:7px;box-shadow:3px 4px 0 #4f402bb0;padding:3px}
.scene-station.station-wok{left:17%}.scene-station.station-pot{left:55%}
.scene-station .stove-lid{font-size:34px;line-height:1.1;filter:drop-shadow(1px 2px 0 #47382a)}
.scene-station .stove-name{font-weight:900;font-size:12px;color:#231b1a}
.scene-station .stove-status{font-size:10px;font-weight:900;color:#fbf1d7;background:#5d594d;border-radius:3px;padding:2px 5px;white-space:nowrap}
.scene-station.active{background:#e4a366;border-color:#804b2d;box-shadow:inset 0 0 0 2px #f4cb83,3px 4px 0 #5f3625;animation:hot-glow 1s ease-in-out infinite alternate}
.stove-flame{position:absolute;top:-19px;right:8px;font-size:24px;color:#d9482c;opacity:.2}
.scene-station.active .stove-flame{opacity:1;animation:steam-rise .7s ease-in-out infinite alternate}
@keyframes steam-rise{from{transform:translateY(4px);opacity:.5}to{transform:translateY(-3px);opacity:1}}
@keyframes hot-glow{from{filter:brightness(1)}to{filter:brightness(1.1)}}
.cook-hero{position:absolute;top:37%;left:44%;width:12%;height:18%;z-index:5;display:flex;align-items:center;flex-direction:column;pointer-events:none;filter:drop-shadow(3px 3px 0 #65422d66)}
.person-sprite{height:43px;width:34px;image-rendering:pixelated;filter:drop-shadow(2px 3px 0 #3d302e4a);transform-origin:bottom center}
.cook-hero .person-sprite{height:42px;width:37px}.chef-name{background:#784733;color:#fff0c4;font-size:9px;padding:1px 3px;border-radius:4px;white-space:nowrap;font-weight:900}
.scene-table{position:absolute;z-index:3;top:56%;width:43%;height:30%;border:0;background:transparent;color:#483429;overflow:visible;padding:0;border-radius:9px}
.scene-table.table-0{left:5%}.scene-table.table-1{right:5%}
.scene-table .table-surface{position:absolute;top:24%;left:13%;width:76%;height:45%;border:5px solid #76502f;background:repeating-linear-gradient(90deg,#bb864e 0 16px,#bf8a57 16px 19px);border-radius:9px;box-shadow:0 6px 0 #5b3a2c,0 10px 0 #e7c49769;display:grid;place-items:center}
.table-platter{border:2px solid #e9debf;background:#ffebc1;border-radius:50%;display:grid;place-items:center;width:31px;height:28px;box-shadow:1px 2px 0 #674328;font-size:16px}
.scene-table .chair{position:absolute;width:40%;height:22%;left:30%;background:#8b5536;border:4px solid #613c29;border-bottom-width:7px;box-shadow:2px 3px 0 #70462c}
.scene-table .chair-top{top:11%}.scene-table .chair-bottom{bottom:11%}
.scene-table .visitor{position:absolute;left:39%;top:11%;z-index:2}.scene-table .visitor.arrived-now{animation:visitor-pop .2s ease-out}
@keyframes visitor-pop{from{transform:scale(.3)}to{transform:scale(1)}}
.scene-table .visitor .person-sprite{width:39px;height:51px}
.scene-table .table-request{position:absolute;left:50%;top:-13%;transform:translateX(-50%);min-width:100px;max-width:140px;background:#fff7d9;color:#453127;border:3px solid #795340;box-shadow:3px 4px 0 #6d4227;border-radius:8px;padding:4px 5px;font-size:10px;font-weight:900;white-space:nowrap;z-index:5;display:flex;align-items:center;flex-direction:column;line-height:1.3}
.table-request small{color:#9f5339;font-size:9px}
.table-request.critic-request{background:#fae5af;border-color:#ad7037}
.table-empty{position:absolute;top:70%;left:50%;transform:translateX(-50%);padding:3px 8px;background:#d4b58c;border:2px solid #a2794a;border-radius:5px;font-size:11px;white-space:nowrap;color:#5b442e;font-weight:800}
.scene-table .scene-patience{position:absolute;bottom:0;left:17%;width:66%;height:9px;background:#a55b49;border:2px solid #613b32;border-radius:3px;z-index:5;overflow:hidden}
.scene-patience i{display:block;background:#75aa5f;height:100%;transition:width .18s linear}
.scene-table.is-urgent .scene-patience i{background:#f8ca5b;animation:danger-pulse .5s infinite alternate}
@keyframes danger-pulse{to{background:#f16e4a}}
.scene-table.is-selected{outline:4px dashed #f6de60;outline-offset:-2px;background:#ffe9ac36;box-shadow:0 0 0 3px #75512c}
.scene-table:disabled,.scene-station:disabled{cursor:default;opacity:1}
.floor-pot{position:absolute;bottom:6%;left:4%;font-size:27px;z-index:4;filter:drop-shadow(2px 2px 0 #835b3c)}
.entrance{position:absolute;bottom:0;left:40%;width:27%;height:17%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:linear-gradient(#ba7844,#a96536);border:4px solid #70452f;border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -5px 0 #e1b179;font-size:22px;z-index:3}
.entrance small{font-family:system-ui,sans-serif;font-size:9px;color:#fff1ca;text-shadow:1px 1px #694127;white-space:nowrap;font-weight:800;margin-bottom:3px}
.scene-caption{display:flex;justify-content:space-between;gap:4px;background:#715238;color:#fff1cd;padding:8px;font-size:10px;font-weight:900}
.restaurant-frame.compact .restaurant-scene{height:245px}
.restaurant-frame.compact .scene-station .stove-lid{font-size:28px}.restaurant-frame.compact .person-sprite{height:34px}.restaurant-frame.compact .table-request{display:none}.restaurant-frame.compact .wall-sign{font-size:10px}
.restaurant-frame.compact .chef-name{font-size:8px}
.service-panel{background:#2a3b34;padding:11px}
.service-panel .restaurant-frame{margin-top:10px}
.wave-track{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.wave-track span{background:#314c42;color:#bcccbf;padding:8px 4px;border-radius:6px;text-align:center;font-size:11px;font-weight:800}
.wave-track .current{background:#f1bb69;color:#49331e}.wave-track .passed{background:#588461;color:#f1f7df}
.scene-status{display:flex;justify-content:space-between;gap:3px;font-size:11px;color:#e9d7af;margin:8px 0 12px}
.service-controls{display:flex;flex-direction:column;gap:1px}.service-controls .button.primary{margin:5px 0}.service-controls>small{color:#bccbb8;font-size:11px;line-height:1.5}
.service-hint{padding:10px;border:1px dashed #859b72;border-radius:9px;background:#334d42;color:#f1edd3;font-size:11px;line-height:1.5;margin-top:9px}
.inspector{background:#405747;border:1px solid #76956c;border-radius:12px;padding:11px;margin:10px 0}
.inspector .paneltop{font-size:13px}.inspector-state{font-size:11px;color:#f7d287}
.inspector-dish{font-size:14px;margin:11px 0}.inspector-dish span{font-size:11px;color:#bde0c6}
.inspector-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.inspector-actions .button{font-size:11px;flex:1;margin:0;min-width:120px}
.station-queue-item,.order-feed-item{border:1px solid #57725b;color:#f3eddc;background:#34493b;display:flex;justify-content:space-between;align-items:center;text-align:left;gap:6px;padding:9px 10px;border-radius:8px;width:100%;margin-top:6px;font-size:11px;min-height:37px}
.station-queue-item:hover,.order-feed-item.highlight{border-color:#f3c479;background:#5a5f42}
.order-feed-item small{font-size:10px;white-space:nowrap;color:#d9c390}.order-feed-item.served{opacity:.65}.order-feed-item.left,.order-feed-item.rejected{opacity:.54}
.order-feed{margin:14px 0}.order-feed .paneltop{font-size:12px}.order-feed .paneltop small{font-size:10px;color:#b7c9b5}
.event-feed{background:#233a34;padding:11px;border-radius:10px;display:flex;flex-direction:column;gap:6px;font-size:11px;color:#dddec4}
.event-feed b{color:#f5c375}.event-feed span{border-bottom:1px dashed #486052;padding-bottom:4px}
.intermission{background:#5b4a36;border:2px solid #bc8e57;border-radius:12px;padding:14px;margin:8px 0}

.cooking-in-service{padding:7px}.cooking-in-service .cookpanel{border:0;margin:0;padding:10px;background:transparent}
@media(max-width:380px){.restaurant-scene{height:318px}.restaurant-frame.compact .restaurant-scene{height:225px}.scene-station .stove-lid{font-size:27px}.scene-station .stove-name{font-size:11px}.scene-station .stove-status{font-size:9px}.scene-table .table-request{min-width:90px;max-width:110px;font-size:9px}.wall-sign{font-size:10px}.scene-caption{font-size:9px}}

function cookResult(){const r=game.lastCook;if(!r)return '';return `<section class="panel result"><h3>${r.sellable?'🎉 成功研发！':'🧪 这锅未达标'}</h3><div class="bigscore">${r.quality}<small>/100 品质</small></div><h3>${r.recipeId?RECIPES[r.recipeId].name:'未知组合'}</h3><p>${r.reason} ${r.effects.join(' · ')}</p><div class="heatguide">${r.heat.map(t=>`<span>${ING[t.id].emoji} ${t.heat}/${t.ideal}</span>`).join('')}</div></section>`}
function research(){return `${game.cook?cookPanel():`${cookResult()}${choicesCook()}`}`}
function menu(){let sy=synergyFor(game.menu);const count={};game.menu.forEach(id=>{const st=RECIPES[id]?.station;if(st)count[st]=(count[st]||0)+1});const ids=Object.keys(game.recipes);return `<section class="panel"><p>从已研发料理中选择 3 道。比较风味覆盖、厨具占用与套餐共鸣。</p>${[0,1,2].map(i=>`<div class="slot"><span>菜单 ${i+1}</span><select data-slot="${i}">${ids.map(id=>`<option value="${id}" ${game.menu[i]===id?'selected':''}>${RECIPES[id].emoji} ${RECIPES[id].name} · ${RECIPES[id].station}</option>`).join('')}</select></div>`).join('')}<div class="synergy"><strong>${sy?'✨ 已激活 '+sy:'暂无主共鸣'}</strong><p>${sy==='辛香暖胃'?'冒险者对辣味菜的适配增加。':sy==='菌香组合'?'家庭与评论家的菌香适配增加。':'尝试辣味肉菜 + 炖煮菜，或两道不同菌香菜。'}</p></div><div class="kitchenpreview"><div>🍳 WOK 炒锅<br><b>${count.WOK||0} 道菜争抢</b></div><div>🍲 POT 炖锅<br><b>${count.POT||0} 道菜争抢</b></div></div>${btn('to-prep','确认今晚菜单 →',!canMenu(game),'primary')}</section>${restaurantScene(game,{interactive:false,compact:true})}<section class="panel"><h3>成本 / 产能参考</h3>${game.menu.map(id=>RECIPES[id]?`<div class="economyline">${RECIPES[id].emoji} ${RECIPES[id].name}<span>🪙${RECIPES[id].price} · ${RECIPES[id].time}s · ${RECIPES[id].station}</span></div>`:'').join('')}</section>`}
function prep(){return `<section class="panel"><p>可提前制作少量菜。备餐立即消耗真实食材，省去营业时的排队；未卖完会报损。</p><div class="tip">${game.day===3?'🔥 挑战营业：评委喜欢辣味和爆香。':''}本晚共三波、约 7 单、两张餐桌、WOK/POT 各一台。</div>${game.menu.map(id=>{const r=RECIPES[id];return `<div class="reciperow"><span class="recipeicon">${r.emoji}</span><div class="recipedesc"><b>${r.name}</b><small>已备 ${game.prep[id]||0} 份 · ${r.station} ${r.time}s</small></div>${btn(`prep:${id}`,'+1份',!canUse(game,r.ids))}</div>`}).join('')}${btn('open','🛎️ 进入食堂营业场景',false,'primary')}</section>`}
function service(){
 if(game.cook)return `<section class="panel cooking-in-service"><div class="tip">⏸ 餐厅暂停：你正在亲手制作关键订单。提交后仍要占用正常的工位时间，顾客也会继续等待。</div>${cookPanel()}</section>`;
 const v=game.service;if(!v)return '';
 const served=v.orders.filter(o=>o.status==='served').length;
 const queued=v.orders.filter(o=>o.status==='queued');
 const cooking=v.orders.filter(o=>o.status==='cooking');
 const outside=v.orders.filter(o=>o.status==='waiting').length;
 const selected=v.orders.find(o=>o.id===selectedOrderId);
 const alive=selected&&['queued','cooking'].includes(selected.status);
 const selectedStationOrders=selectedStation?v.orders.filter(o=>RECIPES[o.recipeId]?.station===selectedStation&&['queued','cooking'].includes(o.status)):[];
 const progress=Math.min(100,Math.round(v.time/85*100));
 const waveLabels=['入座','高峰','压轴'];
 const mode=v.done?'结束':v.breakAt?'波次间休整':v.paused?'暂停中':'营业中';
 const latest=v.events.slice(-3).reverse().map(e=>{
  const o=v.orders.find(x=>x.id===e.order),r=RECIPES[e.recipeId||o?.recipeId];
  const desc={arrived:`${CUSTOMERS[o?.segment]?.name||'顾客'}在 ${Number(e.table)+1} 号桌点单`,started:`${r?.name||'料理'}正在下锅`,served:`${r?.name||'料理'}已送达 · 评价 ${e.sat}`,left:'有顾客等太久离店',rejected:e.reason||'拒单',wave_break:'进入波次间休整',emergency_prep:`应急备餐 ${r?.name||''}`,wave_resumed:'下一波开始',failed_cook:'手工菜火候不合格'}[e.type]||'厨房状态已更新';
  return `<span>${desc}</span>`;
 }).join('');
 const selectedHTML=selected?`<div class="inspector">
   <div class="paneltop"><strong>${selected.tableId!=null?`🍽 ${selected.tableId+1} 号桌 · `:''}${CUSTOMERS[selected.segment]?.name||'顾客'}</strong><span class="inspector-state">${{queued:'等待下锅',cooking:'正在烹饪',served:'已出餐',left:'已经离店',rejected:'无法接单'}[selected.status]||'尚未到店'}</span></div>
   <div class="inspector-dish">${RECIPES[selected.recipeId]?.emoji||'🍽'} ${RECIPES[selected.recipeId]?.name||'暂无'} <span>· 匹配 ${selected.fit}</span></div>
   ${alive?`<div class="patience"><span style="width:${Math.max(0,Math.round((1-(v.time-selected.arrival)/selected.patience)*100))}%"></span></div>`:''}
   <div class="inspector-actions">${btn(`prior:${selected.id}`,'⬆️ 插队优先',selected.status!=='queued','strong')}${btn(`manual:${selected.id}`,'🍳 主厨亲做',selected.status!=='queued'||v.manualUsed>=2||!!selected.manual,'strong')}</div>
  </div>`:'';
 return `<section class="panel service-panel">
  <div class="servicehead"><div><strong>${game.day===3?'🔥 爆炎厨王挑战':'🛎️ 今晚开店'} · ${mode}</strong><small>模拟 ${v.time}s · 服务 ${served}/${v.orders.length} · 门外 ${outside} 位待入场</small></div><span class="badge">🪙 +${v.income}</span></div>
  <div class="wave-track">${waveLabels.map((label,i)=>`<span class="${i===v.wave?'current':''} ${i<v.wave?'passed':''}">${i+1}. ${label}</span>`).join('')}</div>
  ${restaurantScene(game,{selectedOrderId,interactive:!v.done})}
  <div class="scene-status"><span>${cooking.length?'🔥 后厨忙碌':'🫖 后厨可用'} · ${queued.length} 单待制作</span><span>⏱ ${progress}%</span></div>
  ${v.breakAt?`<div class="intermission"><div class="eyebrow">WAVE BREAK · 自由思考不计时</div><h3>第 ${v.breakAt} 波结束 · 店长决策</h3><p>可以应急预制一道餐点（仅此一次），减少下一波等待；这份餐点会真实扣原料，卖不完也会报损。</p><div class="intermission-choices">${game.menu.map(id=>btn(`breakprep:${id}`,`+1 ${RECIPES[id].emoji} ${RECIPES[id].name}`,v.breakUsed||!canUse(game,RECIPES[id].ids),'tiny')).join('')}</div>${btn('resume-break','▶️ 迎接下一波',false,'primary')}</div>`:
  v.done?`<div class="tip">今晚所有订单已经结束。看看哪种菜单真正带来了好评价、哪里出现了排队。</div>${btn('close','📊 查看今晚日报 →',false,'primary')}`:
  `<div class="service-controls">${btn('service-toggle',v.paused?'▶️ 开始 / 继续迎客':'⏸ 暂停营业',false,v.paused?'primary':'strong')}<small>点击客人所在餐桌，或点击炒锅与炖锅，直接处理排队。</small></div>`}
  ${selectedHTML||(!selectedStation?`<div class="service-hint">👆 点餐桌查看顾客需求，选择「插队优先」或「主厨亲做」。操作会影响真实的等待和评价。</div>`:'')}
  ${selectedStation?`<div class="inspector"><div class="paneltop"><b>${selectedStation==='WOK'?'🍳 炒锅':'🍲 炖锅'} · 工位任务</b>${btn('clear-selection','收起',false,'tiny')}</div>${selectedStationOrders.length?selectedStationOrders.map(o=>`<button type="button" class="station-queue-item" data-select-order="${o.id}">${RECIPES[o.recipeId]?.emoji||'🍽'} ${RECIPES[o.recipeId]?.name||''} · ${o.status==='cooking'?'制作中':'排队'} ${o.tableId!=null?`· ${o.tableId+1}桌`:''}</button>`).join(''):'<p>现在没有等待这一工位的订单。</p>'}</div>`:''}
  <div class="order-feed"><div class="paneltop"><b>🧾 实时客单</b><small>点单查看优先级和手做机会</small></div>${v.orders.filter(o=>o.status!=='waiting').map(o=>`<button type="button" class="order-feed-item ${o.status} ${o.id===selectedOrderId?'highlight':''}" data-select-order="${o.id}"><span>${CUSTOMERS[o.segment]?.emoji||'🙂'} ${RECIPES[o.recipeId]?.name||'无法点菜'}</span><small>${o.tableId!=null?`${o.tableId+1}桌 · `:''}${{queued:'候餐',cooking:'烹饪中',served:'✓ 已送达',left:'✕ 离店',rejected:'✕ 无法接单'}[o.status]||''}</small></button>`).join('')}</div>
  <div class="event-feed"><b>📣 店内动态</b>${latest||'<span>准备开门，第一位顾客已在餐桌等待。</span>'}</div>
 </section>`;
}
function report(){const r=game.report;if(!r)return '';return `<section class="panel report"><div class="eyebrow">NIGHT REPORT · DAY ${r.day}</div><div class="metrics"><div><small>销售收入</small><strong>🪙 ${r.revenue}</strong></div><div><small>原料耗用估值</small><strong>${r.cost}</strong></div><div><small>经营贡献利润</small><strong>${r.profit}</strong></div><div><small>顾客满意度</small><strong>${r.sat}</strong></div><div><small>成功交付</small><strong>${r.served}/7</strong></div><div><small>离店 / 拒单</small><strong>${r.left} / ${r.rejected}</strong></div></div><div class="tip">💡 ${r.suggested}</div><h3>📊 菜品销量</h3>${Object.entries(r.byDish).map(([id,d])=>`<div class="economyline">${RECIPES[id].name}<span>${d.count} 份 · 评价 ${Math.round(d.totalSat/d.count)}</span></div>`).join('')||'<p>本晚没有售出菜品。</p>'}<p class="hint">锅具忙碌：WOK ${r.congestion.WOK}s / POT ${r.congestion.POT}s；主共鸣：${r.synergy||'无'}。</p>${r.challenge?`<div class="challenge"><h2>${r.won?'🏆 击败爆炎厨王！':'🔥 厨王挑战未通过'}</h2><div class="bigscore">${r.challenge.score}<small> / 70 目标</small></div><div class="metrics fours">${[['顾客体验',r.challenge.service],['主题掌握',r.challenge.theme],['履约率',r.challenge.fulfillment],['评委料理',r.challenge.signature]].map(([n,v])=>`<div><small>${n}</small><strong>${v}</strong></div>`).join('')}</div><p>${r.won?'永久解锁「猛火掌控」：爆炒时可修正一次过火热量。':'失败不清空仓库与收益，下轮第三天可以重试。'}</p></div>`:''}${btn('to-upgrade','结束本日，查看成长 →',false,'primary')}</section>`}
function upgrade(){return `<section class="panel"><h2>🍽️ 食堂持续成长</h2><p>永久保留菜谱、金币、原材料与厨王技法。完成三天后开启新一轮经营主题。</p><div class="tip">${game.tech?'🔥 猛火掌控已解锁：每锅爆炒可对一份过火食材修正 -1 热量。':'🔒 猛火掌控：首次战胜爆炎厨王后获得。'}</div><div class="reciperow"><span class="recipeicon">⚙️</span><div class="recipedesc"><b>炒锅节能改装</b><small>永久升级 · WOK 制作时间 -2 秒（60 金币）</small></div>${btn('upgrade','升级',game.upgrade||game.coins<60)}</div>${btn('next-day',game.day===3?'🔁 进入新一轮 →':'🌅 开始下一天 →',false,'primary')}</section>`}
function render(){app.innerHTML=header()+({forecast,field,research,menu,prep,service,report,upgrade}[game.phase])()+`<footer>🏠 经营场景 v0.2 · 像素占位 / 真实库存与订单结算 <button class="reset" data-act="reset">重置试玩</button></footer>`;save(game)}
function notify(msg){message=msg;render()}
function action(act){if(act==='reset'){if(!confirm('确定清空本机原型存档，从第一天重开？'))return;game=newGame();tileSelected=null;notify('测试存档已重置。');return}
if(act==='free-cook'){const ids=[...app.querySelectorAll('[data-exp-ing]')].map(e=>e.value).filter(Boolean);const method=app.querySelector('#exp-method').value;if(new Set(ids).size!==ids.length){notify('不能在同一锅加入两次相同食材。');return}notify(startCook(game,ids,method)?'自由实验已开始，试试不同温区与联动条件。':'请选择两至三种有库存的食材。');return}
if(act.startsWith('try:')){const id=act.slice(4),r=RECIPES[id];if(startCook(game,r.ids,r.method))notify(`已放入 ${r.ids.map(x=>ING[x].name).join('、')}。注意每拍只有一次换位。`);else notify('食材不足，无法下锅。');return}
if(act.startsWith('flame:')){const n=Number(act.slice(6));notify(setFlame(game,n)?'火力已改变。黄色预测表示理想区间，红色提示焦糊风险。':'无法调整火力。');return}
if(act==='toss'){notify(tossWok(game)?'颠锅完成！外圈食材已转位，看看下一拍的熟度预测。':'本拍换位机会已用完。');return}
if(act.startsWith('breakprep:')){notify(breakPrep(game,act.slice(10))?'波次间应急备餐成功，原料已真实消耗。':'本波已用过机会或原料不足。');return}
if(act.startsWith('prep:')){notify(prepDish(game,act.slice(5))?'已预制一份，材料已从仓库扣除。':'缺少原料，备餐失败。');return}
if(act==='service-toggle'){notify(setServicePaused(game,!game.service.paused)?game.service.paused?'已暂停营业：模拟时间停止。':'已开始营业：时间和顾客耐心将正常推进。':'当前不能操作暂停。');return}
if(act==='resume-break'){notify(resumeBreak(game)?'下一波开始，注意进门顾客和两个工位的产能。':'无法继续营业。');return}
if(act==='clear-selection'){selectedStation=null;selectedOrderId=null;render();return}
if(act.startsWith('prior:')){notify(expedite(game,act.slice(6))?'已调整同工位的优先排队顺序。':'该订单无法调整。');return}
if(act.startsWith('manual:')){notify(markManual(game,act.slice(7))?'手动烹饪：营业时间暂停，出锅后仍占工位标准制作秒数。':'食材不足或无法手动操作。');return}
switch(act){case'to-field':nextPhase(game,'field');message='选一个食材，再决定采集路线。';break;case'skip-field':skipField(game);message='已跳过探索，直接进入研发。';break;case'collect':{const r=collectNode(game);message=r.message;break;}case'skip-node':{const r=collectNode(game,'skip');message=r.message;break;}case'retreat':settleField(game);message='探索奖励已真实入库，去炒锅试试新食材！';break;case'heat':beat(game);message=`第 ${game.cook?.beats||0} 拍热量已结算，观察颜色和热量区间。`;break;case'finish-cook':{const r=finishCook(game);message=r?.sellable?`已解锁或改良「${RECIPES[r.recipeId].name}」，品质 ${r.quality}！`:`料理未达标：${r?.reason||'未知'}，材料已消耗。`;break;}case'to-menu':nextPhase(game,'menu');message='组合三道菜，留意炒锅与炖锅的产能。';break;case'to-prep':if(canMenu(game)){nextPhase(game,'prep');message='菜单已锁定。可以少量提前备餐。'}break;case'open':nextPhase(game,'service');createService(game);selectedOrderId=null;selectedStation=null;message='餐厅场景已经准备好。点击「开始迎客」，再点桌子处理真实客单。';break;case'close':closeService(game);message='订单日志生成日报，检查产能瓶颈和顾客口味。';break;case'to-upgrade':nextPhase(game,'upgrade');message='可以进行永久升级，再开始下一天。';break;case'upgrade':notify(buyUpgrade(game)?'已升级炒锅：今后每份炒菜 -2 秒。':'金币不足，升级失败。');return;case'next-day':advanceDay(game);message='新的一天开始，库存与菜谱都保留下来了。';break;}render()}
app.addEventListener('click',e=>{const tile=e.target.closest('[data-tile]');if(tile){const i=Number(tile.dataset.tile);if(!game.cook)return;if(tileSelected===null){if(!game.cook.tiles[i])return;tileSelected=i;message='再点击目标格（空格移动，有食材交换）。';render()}else{const from=tileSelected;tileSelected=null;message=moveTile(game,from,i)?'已调整锅中食材位置。':'本拍换位机会已经用完。';render()}return}const b=e.target.closest('[data-act]');if(b){if(b.disabled)return;action(b.dataset.act);return}const seat=e.target.closest('[data-scene-seat]');if(seat){const num=Number(seat.dataset.sceneSeat);const o=game.service?.orders.find(x=>x.tableId===num&&['queued','cooking'].includes(x.status));selectedOrderId=o?.id||null;selectedStation=null;notify(o?`已选中 ${CUSTOMERS[o.segment]?.name||'顾客'}，检查等待状态。`:`${num+1} 号桌空闲，点击工位可查看后厨任务。`);return}const st=e.target.closest('[data-scene-station]');if(st){selectedStation=st.dataset.sceneStation;selectedOrderId=null;notify(`已查看 ${selectedStation==='WOK'?'炒锅':'炖锅'} 的生产与排单。`);return}const select=e.target.closest('[data-select-order]');if(select){selectedOrderId=select.dataset.selectOrder;selectedStation=null;render();return}const target=e.target.closest('[data-target]');if(target){game.selectedTarget=target.dataset.target;render();return}const route=e.target.closest('[data-route]');if(route){enterField(game,route.dataset.route);notify('已进入路线。完成节点后可随时撤离。');return}const buy=e.target.closest('[data-buy]');if(buy){notify(purchase(game,buy.dataset.buy)?'采购成功：金币减少，材料入库。':'金币不足。');return}});
app.addEventListener('change',e=>{if(e.target.matches('[data-slot]')){const idx=Number(e.target.dataset.slot);game.menu[idx]=e.target.value;notify('已调整菜单，观察套餐共鸣与工位负载。')}});
// iOS Safari: support touch movement in addition to the more reliable two-tap path.
app.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-tile]');if(t&&game.cook&&game.cook.tiles[Number(t.dataset.tile)])dragFrom={from:Number(t.dataset.tile),x:e.clientX,y:e.clientY}}, {passive:true});
app.addEventListener('pointerup',e=>{if(!dragFrom)return;const d=dragFrom;dragFrom=null;if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<20)return;const dest=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-tile]');if(dest){tileSelected=null;message=moveTile(game,d.from,Number(dest.dataset.tile))?'拖拽换位成功。':'本拍只能移动一次。';render()}},{passive:true});
setInterval(()=>{if(document.hidden)return;if(game.phase==='service'&&game.service&&!game.cook&&!game.service.done&&!game.service.paused&&!game.service.breakAt){tick(game,1);if(game.service.done)message='营业结束：点击下方按钮查看日报。';else if(game.service.breakAt)message='波次休整！你可以应急备菜，或直接迎接下一波。';render()}},750);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.phase==='service'&&game.service&&!game.service.paused&&!game.service.done&&!game.service.breakAt){game.service.paused=true;message='已切到后台：营业自动暂停，返回后可继续。';save(game)}});
render();

</script></body></html>
