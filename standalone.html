/* v0.4.4 — game-HUD focus, not more forms. This stylesheet is limited to

/* Foraging: one line of glanceable counters and one actual combat button. */
.action-forest .action-hud{top:9px;left:10px;right:10px;padding:0;min-height:39px;background:none;border:0;box-shadow:none;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;pointer-events:none}

.field-action-notice{position:absolute;z-index:4;top:54px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:6px 12px;border-radius:8px;color:#fff1d2;background:#183c31de;font-size:13px;line-height:1.35;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 2px 8px #15351c80}

.action-forest .field-skill:active{transform:scale(.94);box-shadow:0 2px 0 #633b2b}
.field-skill .skill-glyph{font-size:27px;line-height:1.0;filter:drop-shadow(0 1px #59382a)}
.field-skill .skill-caption{font-weight:900;font-size:13px;letter-spacing:.5px;line-height:1.25}

function liveCookAmount(drop,t,actions,vessel){
 const rate=vessel==='POT'?.92:1.10;
 let count=Math.max(0,t-drop.t)*rate;
 for(const a of actions||[]){
  if(!a.with?.includes(drop.id))continue;
  count+=({flip:.9,toss:.45,gentle:.75,reduce:.35}[a.type]||0);
 }
 return count;
}
function liveIngredientState(drop,t,actions,vessel){
 if(!drop)return '待下锅';
 const ratio=liveCookAmount(drop,t,actions,vessel)/(REQUIRE[drop.id]*(vessel==='POT'?1.18:1));
 const age=Math.max(0,t-drop.t);
 if(ratio<.65)return '偏生';
 if(ratio<1)return '受热中';
 if((ratio>3.4&&['beef','chicken','potato'].includes(drop.id))||
    age>(drop.id==='ember_pepper'&&vessel==='POT'?19:['garlic','chili','onion','ember_pepper'].includes(drop.id)?14:16))return '焦糊';
 return '熟透';
}
function readCookFacts(ids,vessel,drops,actions,t){

 const leader=MAIN_PRIORITY.find(id=>ids.includes(id));
 const main=ds.find(d=>d.id===leader)||ds.find(d=>['beef','chicken','potato','cabbage','mushroom'].includes(d.id))||ds[0];
 const aromaLead=ds.some(d=>d.id!==main?.id&&PRIMARY_AROMATIC[d.id]&&
   main&&d.t<=main.t-1.05);
 const toss=actions.find(a=>a.type==='toss'),flip=actions.find(a=>a.type==='flip'),
       gentle=actions.find(a=>a.type==='gentle'),reduce=actions.find(a=>a.type==='reduce');
 const burst=!!(toss&&main&&toss.t>=main.t&&toss.t-main.t<=3.8&&toss.with.length>=2);

 // Garlic+mushroom has mushroom as main and garlic as aroma;
 // mushroom+chicken has chicken as main and mushroom as aroma.

     (burst?'burst':aromaLead&&(flip||toss)?'aroma':flip?'home_even':'home'):
     (reduceGood?'reduced':gentle?'gentle':'pot_home');
 return {style,aromaLead,burst,evenHeat:!!flip,softStir:!!gentle,reduceGood,
   primaryIngredient:main?.id||null,ingredientOrder:ds.map(d=>d.id)};
}
function resolveTechnique(recipeId,style){

 // it never inherits a Universal economic modifier.
 return {
   affinity:match?.affinity||'ordinary',
   affinityLabel:LIVE_AFFINITY[match?.affinity||'ordinary'],
   reason:match?.culinaryReason||(style==='burst'?'这锅带有明显的锅气。':style==='reduced'?'收汁形成了浓厚汤汁。':'食材组合形成了一道可售料理。'),
   guestFitDelta:match?.guestFitDelta||{},
   timeDeltaSeconds:match?.timeDeltaSeconds||0,
   priceDeltaCoins:match?.priceDeltaCoins||0,
   curated:!!profile

}
function evaluateLiveCook(ids,vessel,drops,actions,elapsed){
 const id=liveRecipeId(ids,vessel);
 const recipe=id&&RECIPES[id];
 const sorted=[...drops].sort((a,b)=>a.t-b.t||a.index-b.index);
 const facts=readCookFacts(ids,vessel,sorted,actions,elapsed);
 const missing=ids.filter(id=>!sorted.some(d=>d.id===id)),undercooked=[],burnt=[],slight=[];
 const doneness=sorted.map(d=>{
  const label=liveIngredientState(d,elapsed,actions,vessel);
  if(label==='偏生')undercooked.push(d.id);
  if(label==='受热中')slight.push(d.id);
  if(label==='焦糊')burnt.push(d.id);
  return {id:d.id,label};
 });
 const sellable=!!recipe&&!missing.length&&!undercooked.length&&!burnt.length;
 const technique=resolveTechnique(id,facts.style);
 const finishState=!recipe?'未知组合':missing.length?'漏下料':undercooked.length?'夹生失败':burnt.length?'焦糊失败':slight.length?'略欠火':'成功';
 let quality=72-slight.length*16;
 if(facts.aromaLead)quality+=4;
 if(facts.evenHeat||facts.softStir)quality+=5;
 if(facts.burst)quality+=6;
 if(facts.reduceGood)quality+=5;
 if(!actions.length)quality+=2;
 // Suitability is not an auto-win or auto-90. All styles can succeed.
 quality=Math.min(90,Math.max(35,quality));
 const extra=facts.burst?'锅气':facts.aromaLead?'香气底味':facts.evenHeat?'均匀受热':facts.softStir?'柔和融合':facts.reduceGood?'浓厚酱汁':'自然烹制';
 return {recipeId:id,recipeName:recipe?.name||'未识别料理',
  ids:[...ids],vessel,quality,sellable,status:finishState,style:facts.style,
  styleLabel:LIVE_STYLES[facts.style],secondaryTrait:extra,
  affinity:technique.affinity,affinityLabel:technique.affinityLabel,
  culinaryReason:technique.reason,events:sorted.map(d=>({...d})),
  actions:actions.map(a=>({...a,with:[...a.with]})),duration:+elapsed.toFixed(2),
  doneness:[...doneness,...missing.map(id=>({id,label:'未下锅'}))],
  reason:!sellable?finishState:(slight.length?'可以出售，但部分食材欠火，品质偏低。':technique.reason),
  facts};
}

// v0.6.3-C: deterministic, stateless presentation for the live pan.
// Exactly one transform per original ingredient node; no clones, canvas trails,
// transform/keyframe races or duplicated emoji/sprite layers.
const MOTION_DURATION={flip:1.15,toss:.88,gentle:1.35,reduce:1.55};
const ACTION_LABEL={flip:'🍳 翻炒',toss:'↗ 颠勺',gentle:'🥄 轻搅',reduce:'💧 收汁'};
const motionClamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=p=>1-Math.pow(1-p,3);

function livePanMotion(cook,dimensions={width:310,height:190}){
 const w=Math.max(160,dimensions.width||310),h=Math.max(90,dimensions.height||190);
 const t=Math.max(0,cook?.elapsed||0),isPot=cook?.vessel==='POT';
 const drops=cook?.dropped||[],actions=cook?.actions||[];
 // Actions are keyed to the recipe's actual elapsed clock, not wall-clock time.
 // This makes a re-render or saved-game resume unable to spawn duplicate effects.
 const active=actions.slice().reverse().find(a=>t>=a.t&&(t-a.t)<(MOTION_DURATION[a.type]||0));
 const p=active?motionClamp((t-active.t)/MOTION_DURATION[active.type]):1;
 const swing=active?Math.sin(Math.PI*p):0;
 const radiusX=Math.min(w*.205,h*.32),radiusY=Math.min(w*.12,h*.19);
 const latestReduction=actions.slice().reverse().find(a=>a.type==='reduce'&&t>=a.t);
 let panRotation=0,panLift=0,glow=0,ripple=0,
     brothScale=latestReduction?1-.37*easeOut(motionClamp((t-latestReduction.t)/MOTION_DURATION.reduce)):1,steam=1;
 if(active?.type==='toss'){panRotation=12*Math.sin(Math.PI*2*p)*Math.pow(1-p,.38);panLift=-7*swing;glow=.55*swing;steam=1+.75*swing;}
 if(active?.type==='flip'){panRotation=4.5*Math.sin(Math.PI*4*p)*(1-p);glow=.35*swing;steam=1+.2*swing;}
 if(active?.type==='gentle'){panRotation=1.6*Math.sin(Math.PI*2*p);ripple=.85*swing;steam=1+.16*swing;}
 if(active?.type==='reduce'){ripple=.55*swing;glow=.35*swing;steam=1+1.4*swing;}
 const items=drops.map((d,i)=>{
   // Base simmer movement uses elapsed cooking time, not frame count.
   // Individual action motion applies only to ingredients already in the pot.
   const angle=t*(isPot?.62:1.17)+i*2.3999632;
   let x=Math.cos(angle)*radiusX,y=Math.sin(angle)*radiusY;
   let rotation=0,scale=1;
   const age=t-(d.t||0);
   if(active?.with?.includes(d.id)){
    if(active.type==='toss'){
     // Shared ballistic arc. All food remains the SAME DOM nodes.
     x+=Math.sin(p*Math.PI)*Math.min(18,w*.06)+Math.sin(i*2.7)*5*swing;
     y-=Math.min(58,h*.34)*swing;
     rotation=180*p*(i%2===0?1:-1);
     scale=1+.13*swing;
    }else if(active.type==='flip'){
     const spin=2*Math.PI*1.35*easeOut(p);
     x=Math.cos(angle+spin)*radiusX*1.02;
     y=Math.sin(angle+spin)*radiusY*.95;
     rotation=220*p;
    }else if(active.type==='gentle'){
     const stir=2*Math.PI*.75*easeOut(p);
     x=Math.cos(angle+stir)*radiusX*.72;
     y=Math.sin(angle+stir)*radiusY*.69;
     rotation=32*swing;
    }else if(active.type==='reduce'){
     x*=1-.13*swing;y*=1-.13*swing;
     scale=1-.08*swing;
    }
   }
   // A single entry arc. No duplicate falling icon is ever drawn.
   if(age>=0&&age<.53){
     const entry=1-easeOut(motionClamp(age/.53));
     y-=Math.min(76,h*.48)*entry;
     scale*=.88+.12*(1-entry);
   }
   return {id:d.id,x,y,rotation,scale,opacity:1};
 });
 return {
   items,panRotation,panLift,glow,ripple,brothScale,steam,
   action:active?.type||null,
   actionLabel:active?ACTION_LABEL[active.type]:null,
   actionOpacity:active?Math.pow(Math.sin(Math.PI*p),.75):0,
   elapsed:t
 };
}

const clamp075=(x,a,b)=>Math.max(a,Math.min(b,x));
const close075=(a,b,rx,ry)=>((a.x-b.x)/rx)**2+((a.y-b.y)/ry)**2<1;
function dinerSpot(hero,s=null){

function dinerBlocked(x,y,s=null){

 const characters=Array.from(words||'').slice(0,16);
 const lines=characters.length>8?[characters.slice(0,8).join(''),characters.slice(8).join('')]:[characters.join('')];
 const fontSize=kind==='order'?11:10.5;
 const width=Math.min(135,Math.max(62,Math.ceil(Math.max(...lines.map(x=>x.length))*fontSize+20)));

}
function dinerBubbleLayout(orders,t,w,h){
 const padding=8,placed=[];
 // Sit-down seats get fixed positions, but the speech follows a moving guest
 // on the approach/exit. Keep ordering deterministic for screenshot stability.
 let actors=(orders||[]).map(order=>{
  const bubble=guestSceneBubble(order,t),pos=guestStagePosition(order,t,w,h);
  if(!bubble?.text||!pos.visible)return null;
  const size=dinerBubbleSize(bubble.text,bubble.kind);
  return {id:order.id,tableId:order.tableId,seatId:order.seatId,kind:bubble.kind,words:bubble.text,
   anchorX:pos.x,anchorY:pos.y-22,...size};
 }).filter(Boolean);
 // Low-value menu musing yields to actual dish requests and post-meal reviews.
 // Two diners can still chat together; crowded tables don't make four loud cards.
 const important=actors.filter(a=>a.kind!=='choice');
 if(actors.length>2)actors=[...important,...actors.filter(a=>a.kind==='choice').slice(0,Math.max(0,2-important.length))];
 actors.sort((a,b)=>a.anchorY-b.anchorY||Math.min(a.anchorX,w-a.anchorX)-Math.min(b.anchorX,w-b.anchorX)||a.anchorX-b.anchorX||String(a.id).localeCompare(String(b.id)));
 for(const item of actors){
  const side=item.seatId===0?-1:1;
  const xOffsets=[side*26,0,side*49,-side*18,side*65,-side*42];
  const upOffsets=[0,7,22,39,55,72,90,110];
  let best=null;
  for(const up of upOffsets){
   for(const dx of xOffsets){
    const x=Math.max(padding,Math.min(w-padding-item.width,item.anchorX+dx-item.width/2));
    const y=Math.max(padding,Math.min(h-padding-item.height,item.anchorY-6-up-item.height));
    const overlap=placed.reduce((sum,p)=>{
      const ix=Math.max(0,Math.min(x+item.width,p.x+p.width+5)-Math.max(x,p.x-5));
      const iy=Math.max(0,Math.min(y+item.height,p.y+p.height+5)-Math.max(y,p.y-5));
      return sum+ix*iy;
    },0);
    const displacement=Math.abs((x+item.width/2)-item.anchorX);
    const penalty=overlap*10000+up*.8+displacement*.20+Math.abs(dx-side*26)*.55;
    if(best===null||penalty<best.penalty)best={x,y,penalty};
   }
  }
  placed.push({...item,x:best.x,y:best.y});

}

// Every shift begins and ends at the service station. Queue interactions
// rather than retarget a moving actor when another guest arrives.
function waiterJobs(v){
 const events=(v?.events||[]).filter(e=>['seated','ordered','served'].includes(e.type));
 let end=0;
 return events.map(e=>{
  const start=Math.max(e.t,end),duration=e.type==='ordered'?3.4:3.8;
  end=start+duration;
  return {start,end,type:e.type,table:e.table??v.orders?.find(o=>o.id===e.order)?.tableId??0};
 });
}
function waiterStagePosition(v,t,w,h){
 const home={x:w*.5,y:h*.79};
 const job=waiterJobs(v).find(j=>t>=j.start&&t<j.end);
 if(!job)return {...home,moving:false};
 const a=(t-job.start)/(job.end-job.start);
 const p=a<.43?smooth(a/.43):a>.63?1-smooth((a-.63)/.37):1;

// Compact speech is painted INSIDE the one restaurant canvas. It has no DOM
// hit target, cannot intercept the joystick, and never covers either table.

const speechClamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function speechRectOverlap(a,b,pad=0){
 return Math.max(0,Math.min(a.x+a.width+pad,b.x+b.width+pad)-Math.max(a.x-pad,b.x-pad))*
        Math.max(0,Math.min(a.y+a.height+pad,b.y+b.height+pad)-Math.max(a.y-pad,b.y-pad));
}
// Deterministic speech placement for one Canvas frame. Guest priority and
// actual head positions drive layout; staff chatter uses only spare space.
// Returns a map of cue IDs, not persistent game state or interactive overlays.
function placeRestaurantSpeech(guestCues,workerCue,actors,w,h){
 const byId=new Map(actors.map(a=>[a.id,a])),placed=[],result=new Map();
 const items=[...(guestCues||[]).map(cue=>({cue,actor:byId.get(cue.id),staff:false})),
   ...(workerCue?[{cue:workerCue,actor:byId.get(workerCue.staffRole),staff:true}]:[])]
   .filter(x=>x.actor&&x.cue.text)
   .sort((a,b)=>(b.cue.priority||0)-(a.cue.priority||0)||Number(a.staff)-Number(b.staff));
 const safeTop=h*.205+4,safeBottom=h*.90,margin=7;
 // A speech bubble belongs to its speaker. Never trade that identity away to
 // avoid scenery: previous collision scoring teleported bubbles below cooks
 // and towards neighbouring dining tables on narrow phones.
 for(const {cue,actor,staff} of items){
  const lines=diningBubbleLines(cue.text,staff?12:16);
  const font=staff?10:11,height=lines.length>1?(staff?35:40):(staff?27:29);
  const width=Math.min(w-2*margin,Math.min(staff?116:129,Math.max(64,
    Math.max(...lines.map(line=>Array.from(line).length))*font+18)));
  const ax=actor.x*w,ay=actor.y*h;
  // Pixel actors are drawn with their feet at (ax,ay); the tip should point
  // to the forehead, not to the table, the feet or the order emoji.
  const tipX=ax,tipY=ay-24;
  const originY=tipY-height-12;
  const offsets=staff?[0,17,-17,29,-29]:[0,14,-14,27,-27];
  let best=null;
  for(const [i,off] of offsets.entries()){
   const left=speechClamp(ax-width/2+off,margin,w-width-margin);
   const top=speechClamp(originY,safeTop,Math.max(safeTop,safeBottom-height));
   const box={x:left,y:top,width,height};
   const peer=placed.reduce((sum,p)=>sum+speechRectOverlap(box,p,4),0);
   const coversOtherHeads=actors.filter(other=>other!==actor).reduce((sum,other)=>
    sum+speechRectOverlap(box,{x:other.x*w-11,y:other.y*h-30,width:22,height:29},2),0);
   const tail=Math.hypot(speechClamp(tipX,left+9,left+width-9)-tipX,tipY-(top+height));
   const penalty=peer*120+ coversOtherHeads*38+ Math.max(0,tail-30)*90+
     Math.abs(off)*1.5+Math.abs(top-originY)*.8+i*.5;
   if(!best||penalty<best.penalty)best={...box,penalty};
  }
  // Suppress low-value worker chatter rather than let it cover a customer,
  // the hero or migrate into an unrelated corner of the restaurant.
  if(!best)continue;
  const overlap=placed.reduce((sum,p)=>sum+speechRectOverlap(best,p,3),0);
  if(staff&&overlap>0)continue;
  const baseX=speechClamp(tipX,best.x+9,best.x+best.width-9);
  const baseY=best.y+best.height;
  if(staff&&Math.hypot(baseX-tipX,baseY-tipY)>40)continue;
  placed.push(best);
  result.set(cue.id,{...best,lines,baseX,baseY,tipX,tipY,staff,dir:'above'});
 }

}
function drawSpeechCard(c,cue,p,staff=false){

 c.fillStyle=fill;c.strokeStyle=stroke;c.lineWidth=1.1;

       staff?'#2f493e':negative?'#7b4237':'#394234',staff?10:11);

}

function render(){
 if(walking&&(!game.field||game.phase!=='field')){clearInterval(walking);walking=null;}
 // Restoring horizontal chip position prevents the target selector from snapping
 // back to the first ingredient on every tap; same for an open reference sheet.
 const prevTargetScroll=app.querySelector('.target-scroller')?.scrollLeft||0;
 const prevSheetScroll=app.querySelector('.sheet-body')?.scrollTop||0;
 const [stage,dock]=({forecast,field,research,menu,prep,service,report,upgrade}[game.phase])();
 app.innerHTML=shell(stage,dock);
 const target=app.querySelector('.target-scroller');if(target)target.scrollLeft=prevTargetScroll;
 const sheet=app.querySelector('.sheet-body');if(sheet)sheet.scrollTop=prevSheetScroll;
 // Preserve the on-screen floating stick when a second finger uses the skill.
 if(stick.pointer!==null){const pad=app.querySelector('#field-stick, #diner-stick'),knob=app.querySelector('#field-stick-knob, #diner-stick-knob');if(pad){pad.classList.add('active');pad.style.left=stick.originX+'px';pad.style.top=stick.originY+'px';}if(knob)knob.style.transform=`translate(${stick.x*54}px,${stick.y*54}px)`;}
 save(game);
}
function note(txt){message=txt;flashUntil=performance.now()+1900;render()}
function stepMove(dx,dy){const result=moveExplorer(game,dx,dy);if(result.ok)message=result.message;render();return result.ok}
function findPath(x,y){const f=game.field;if(!f)return [];const start=[f.x,f.y];const seen=new Set([start.join(',')]);let paths=[[...start,[]]];while(paths.length){const [cx,cy,path]=paths.shift();if(cx===x&&cy===y)return path;for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){const nx=cx+dx,ny=cy+dy,key=`${nx},${ny}`;if(nx<0||ny<0||nx>=f.worldW||ny>=f.worldH||seen.has(key)||f.obstacles.some(o=>o.x===nx&&o.y===ny))continue;seen.add(key);paths.push([nx,ny,[...path,[dx,dy]]]);}}return []}
function walkTo(x,y){if(walking)clearInterval(walking);const path=findPath(x,y);if(!path.length){note('点击可到达的地图格，或用方向键行走。');return}walking=setInterval(()=>{const step=path.shift();if(!step||game.phase!=='field'||!game.field||game.field.settled){clearInterval(walking);walking=null;return}const old=game.field.nodes.filter(n=>n.claimed).length;stepMove(...step);if(game.phase!=='field'||game.field.nodes.filter(n=>n.claimed).length>old||!path.length){clearInterval(walking);walking=null;}},130)}
