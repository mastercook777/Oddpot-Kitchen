/* v0.4.4 — game-HUD focus, not more forms. This stylesheet is limited to
   playable exploration and restaurant; business logic stays in engine. */
:root{--hud043-cream:#fff2d6;--hud043-dark:#17372c;--hud043-edge:#c8b687}
.stage.field:has(.action-forest),.stage.service{isolation:isolate}

.stage.field:has(.action-forest)~.dock,.stage.service~.dock{min-height:calc(70px + env(safe-area-inset-bottom))}
.ingame-notice{position:absolute;top:48px;left:50%;transform:translateX(-50%);z-index:15;max-width:calc(100% - 36px);width:max-content;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:8px 15px;color:#fff2d8;background:#183b30ed;border:1px solid #dabd81;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 3px 12px #061c1599;animation:noteIn .15s ease-out}

@keyframes noteIn{from{opacity:0;transform:translate(-50%,-5px)}to{opacity:1;transform:translate(-50%,0)}}
/* Foraging: one line of glanceable counters and one actual combat button. */
.action-forest .action-hud{top:9px;left:10px;right:10px;padding:0;min-height:39px;background:none;border:0;box-shadow:none;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;pointer-events:none}

.action-hud .field-hp{font-size:22px;letter-spacing:1px;min-width:94px;color:#ef8471;padding:0 8px}
.action-hud .field-bag-chip{pointer-events:auto;min-width:93px;gap:6px;padding:0 11px;cursor:pointer;font-size:13px;font-family:inherit}

.action-hud .field-clock{font-size:15px;min-width:52px;padding:0 8px}
.field-action-notice{position:absolute;z-index:4;top:54px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);padding:6px 12px;border-radius:8px;color:#fff1d2;background:#183c31de;font-size:13px;line-height:1.35;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;box-shadow:0 2px 8px #15351c80}
.action-forest .field-skill{position:absolute;z-index:10;right:14px;bottom:18px;width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;background:radial-gradient(circle at 36% 24%,#e6a56b,#ad543d 67%,#7b392f);border:3px solid #ffe0a1;color:#fff5d9;border-radius:50%;box-shadow:0 4px 0 #633b2b,0 4px 15px #1524178c;touch-action:none;-webkit-tap-highlight-color:transparent}
.action-forest .field-skill:active{transform:scale(.94);box-shadow:0 2px 0 #633b2b}
.field-skill .skill-glyph{font-size:27px;line-height:1.0;filter:drop-shadow(0 1px #59382a)}
.field-skill .skill-caption{font-weight:900;font-size:13px;letter-spacing:.5px;line-height:1.25}
.field-skill .skill-cooldown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:conic-gradient(#10271fc9 var(--cooldown,100%),#173b32af var(--cooldown,100%));font-size:23px;font-weight:900;color:#fff6dc;text-shadow:0 2px 2px #172d26}
.action-forest .field-skill:disabled{opacity:.9;filter:saturate(.58)}
.field-compact-dock{min-height:42px;height:45px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.field-compact-dock .field-touch-tip{flex:1;padding:0;color:#f6dca8;font-size:13px;font-weight:750;text-align:left}

.service-scene .diner-table .seat-label{bottom:7%;padding:4px 9px;border-radius:8px;color:#fff0ce;background:#183b30e9;font-size:12px;font-weight:850;line-height:1.3;text-shadow:none;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

function today(s){return FORECAST[(s.day-1)%3]}
