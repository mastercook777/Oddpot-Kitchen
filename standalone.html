.v014c-grill-head div{display:grid;gap:2px}.v014c-grill-head small{font-size:11px;color:#e6b885;letter-spacing:.12em}.v014c-grill-head strong{font-size:22px;line-height:1.2}.v014c-grill-head>b{font-variant-numeric:tabular-nums;background:#3e302a;border:1px solid #a27451;border-radius:10px;padding:6px 10px;white-space:nowrap}

.v014c-hearth:before,.v014c-hearth:after{content:'';position:absolute;inset:13px 0 auto;height:5px;background:#6d625c;box-shadow:0 126px #6d625c}.v014c-hearth:after{inset:22px 0 auto;height:2px;background:#a39582;box-shadow:0 109px #a39582}
.v014c-coals{position:absolute;inset:25px 12px 21px;display:flex;align-items:center;justify-content:space-around;opacity:.24;transition:opacity .3s}.v014c-hearth.lit .v014c-coals{opacity:1}.v014c-coals i{display:block;width:16%;height:40%;transform:rotate(25deg);background:linear-gradient(110deg,#713e26,#c96331 58%,#f5af51 65%,#4e342c 72%);box-shadow:0 0 20px #ea753c;animation:v014c-ember 1.9s infinite alternate}.v014c-coals i:nth-child(even){animation-delay:-.7s}.v014c-hearth.edge .v014c-coals{opacity:.45}.v014c-hearth.flame .v014c-coals{filter:saturate(1.35) brightness(1.3)}
.v014c-rail{position:absolute;inset:0;display:grid;place-items:center}.v014c-skewer{display:flex;align-items:center;justify-content:center;position:relative;min-width:82%;height:68px;transform:rotate(-5deg);transition:transform .4s}.v014c-skewer.cooking{animation:v014c-heat 2.5s ease-in-out infinite}.v014c-skewer.turned{transform:rotate(5deg)}.v014c-stick{height:6px;background:linear-gradient(#e4d7b2,#af8861,#52392b);position:absolute;width:95%;left:-3%;box-shadow:0 3px 2px #130d0c}.v014c-stick:before{content:'';position:absolute;left:-9px;top:-4px;border-top:7px solid transparent;border-bottom:7px solid transparent;border-right:11px solid #d3c69e}.v014c-handle{position:absolute;right:-13px;width:30px;height:13px;background:linear-gradient(#b48454,#553424);border:2px solid #3d291f;border-radius:4px 8px 8px 4px}.v014c-bead{z-index:1;width:46px;height:46px;border-radius:12px;background:radial-gradient(circle at 35% 25%,#f6c888,#ab613d 65%,#513028);border:3px solid #68412b;box-shadow:3px 5px 2px #100e0bb0;display:grid;place-items:center;transform:rotate(calc((var(--i) - 1)*9deg));animation:v014c-bead .22s both}.v014c-empty{z-index:1;font-size:12px;background:#211b18dc;padding:8px 12px;border-radius:9px}.v014c-brush{position:absolute;right:10%;top:-30px;opacity:0;transition:top .35s,opacity .25s}.v014c-brush.brushed{top:28px;opacity:1;animation:v014c-brush 1.2s ease-in-out}
.v014c-gauges{display:grid;gap:5px;margin:15px 0 9px}.v014c-gauge{display:flex;align-items:center;gap:7px;padding:5px 8px;background:#26362f;border:1px solid #627d5e;border-radius:10px;min-height:39px}.v014c-gauge>div:nth-child(2){display:flex;flex:1;align-items:center;justify-content:space-between;min-width:0}.v014c-gauge b{font-size:12px}.v014c-gauge small{font-size:11px;color:#d6cbb1}.v014c-gauge[data-heat-tone=good]{border-color:#a4c66c}.v014c-gauge[data-heat-tone=bad]{border-color:#e36e4a}.v014c-faces{display:grid;gap:4px;width:62px;flex:none}.v014c-faces i{height:7px;border:1px solid #b79162;border-radius:6px;background:linear-gradient(90deg,#f3b75e var(--fill),#414043 var(--fill))}.v014c-faces i:last-child{background:linear-gradient(90deg,#db7950 var(--fill),#414043 var(--fill))}

function liveCookAmount(drop,t,actions,vessel){
 const rate=vessel==='POT'?.92:vessel==='STEAM'?(actions?.some(a=>a.type==='seal')?1.02:.63):1.10;
 let count=Math.max(0,t-drop.t)*rate;

  if(!a.with?.includes(drop.id))continue;
  count+=({flip:.9,toss:.45,gentle:.75,reduce:.35,seal:.85,vent:.2}[a.type]||0);
 }
 return count;
}
function liveIngredientState(drop,t,actions,vessel){

 const age=Math.max(0,t-drop.t);
 if(ratio<.65)return '偏生';
 if(ratio<1)return '受热中';
 if((ratio>3.4&&['beef','chicken','potato'].includes(drop.id))||
    age>(drop.id==='ember_pepper'&&vessel==='POT'?19:['garlic','chili','onion','ember_pepper'].includes(drop.id)?14:16))return '焦糊';
 return '熟透';

  return {state:h.state,baseState:h.state,progress:Math.min(h.frontProgress,h.backProgress),frontProgress:h.frontProgress,backProgress:h.backProgress,tone:h.tone,nearBurn:false};

 const state=nearBurn?'将焦':baseState;
 const tone=baseState==='焦糊'?'bad':nearBurn?'warning':baseState==='熟透'?'good':'warming';
 return {state,baseState,progress:Math.max(0,Math.min(100,Math.round(ratio*100))),tone,nearBurn};

function readCookFacts(ids,vessel,drops,actions,t){

 const main=ds.find(d=>d.id===leader)||ds.find(d=>['beef','chicken','potato','cabbage','mushroom'].includes(d.id))||ds[0];
 const aromaLead=ds.some(d=>d.id!==main?.id&&PRIMARY_AROMATIC[d.id]&&
   main&&d.t<=main.t-1.05);
 const toss=actions.find(a=>a.type==='toss'),flip=actions.find(a=>a.type==='flip'),
       gentle=actions.find(a=>a.type==='gentle'),reduce=actions.find(a=>a.type==='reduce'),
       seal=actions.find(a=>a.type==='seal'),vent=actions.find(a=>a.type==='vent');

 // mushroom+chicken has chicken as main and mushroom as aroma.

 const style=vessel==='STEAM'?(steamEven?'steam_even':vent?'steam_dry':'steam_home'):vessel==='WOK'?
     (burst?'burst':aromaLead&&(flip||toss)?'aroma':flip?'home_even':'home'):
     (reduceGood?'reduced':gentle?'gentle':'pot_home');

}

const MOTION_DURATION={flip:1.15,toss:.88,gentle:1.35,reduce:1.55};

 const p=active?motionClamp((t-active.t)/MOTION_DURATION[active.type]):1;

     brothScale=latestReduction?1-.37*easeOut(motionClamp((t-latestReduction.t)/MOTION_DURATION.reduce)):1,steam=1;

 if(active?.type==='gentle'){panRotation=1.6*Math.sin(Math.PI*2*p);ripple=.85*swing;steam=1+.16*swing;}

 // short physical dwell, NEVER teleported at the next whole-second tick.

 // but always via the same delivery/landing path used by the original ledger.
 for(const o of v.orders){

// v0.12-D: one painter for the real service actor AND its magnified staff-sheet portrait.
function drawCrewPortrait(canvas,role,level=1){
 if(!canvas||typeof canvas.getContext!=='function')return false;
 const look=crewAppearance(role,level);
 if(!look)return false;
 const c=canvas.getContext('2d');if(!c)return false;
 c.clearRect(0,0,canvas.width,canvas.height);
 c.imageSmoothingEnabled=false;
 const scale=Math.min(canvas.width/28,canvas.height/36);
 pixelActor(c,role,Math.round(canvas.width/2),Math.round(canvas.height*.59),scale,
  {walk:0,attack:false,level:look.level,face:1});
 return true;
}
function drawCrewPortraits(root){
 if(!root||typeof root.querySelectorAll!=='function')return 0;
 let count=0;
 for(const canvas of root.querySelectorAll('canvas[data-crew-portrait]')){
  const look=crewAppearance(canvas.dataset.crewPortrait,Number(canvas.dataset.level));
  if(look&&drawCrewPortrait(canvas,look.role,look.level))count++;
 }
 return count;
}

const GUEST_KINDS=new Set(Object.keys(CUSTOMERS));
function drawGuestPortrait(canvas,kind){
 if(!GUEST_KINDS.has(kind)||!canvas||typeof canvas.getContext!=='function')return false;
 const c=canvas.getContext('2d');
 if(!c)return false;
 c.imageSmoothingEnabled=false;
 c.clearRect(0,0,canvas.width,canvas.height);
 // 64x80-native thumbnail; the actor's original 16x24-ish raster silhouette
 // is reproduced pixel-for-pixel at a fixed, integer-positioned scale.
 pixelActor(c,kind,Math.round(canvas.width/2),Math.round(canvas.height/2)+7,2.45,{face:1,walk:0,attack:false});
 return true;
}
function drawGuestPortraits(root){
 if(!root||typeof root.querySelectorAll!=='function')return 0;
 let drawn=0;
 for(const node of root.querySelectorAll('canvas[data-guest-portrait]')){
  if(drawGuestPortrait(node,node.dataset.guestPortrait))drawn++;
 }
 return drawn;
}
// Shared pure pointer math; platform-independent so it can be unit-tested.
function joystickVector(originX,originY,pointerX,pointerY,radius=54,deadZone=9){
 const dx=pointerX-originX,dy=pointerY-originY,d=Math.hypot(dx,dy);
 if(d<=deadZone)return {x:0,y:0,knobX:0,knobY:0};
 const t=Math.min(1,(d-deadZone)/Math.max(1,radius-deadZone));
 const a=t*dx/d,b=t*dy/d;
 return {x:a,y:b,knobX:dx/d*Math.min(radius,d),knobY:dy/d*Math.min(radius,d)};
}

 const helper=!!crew?.helper?.hired,waiter=!!crew?.waiter?.hired;
 const helperName=s.activeWorld==='cloud'?'阿岚':'阿火',waiterName=s.activeWorld==='cloud'?'小羽':'小芽';
 if(!helper&&!waiter)return null;
 const events=v.events||[];
 // A prep failure gets a distinct staff acknowledgment AFTER the rejected
 // guest's urgent farewell has ended; never compete with that complaint.
 if(helper){
  const recentShortage=[...events].reverse().find(e=>e.type==='rejected'&&e.reason==='食材不足'
    &&t-e.t>=2.55&&t-e.t<4.0);
  if(recentShortage)return {id:'staff-shortage-'+recentShortage.order,staffRole:'helper',
   kind:'staff',priority:4,text:['哎呀，材料用完了！','得赶紧补补库存！','这道菜缺食材了！'][speechHash(recentShortage.order)%3],
   phase:clampSpeech((t-recentShortage.t-2.55)/1.45)};
 }
 for(let i=events.length-1;i>=Math.max(0,events.length-10);i--){
  const e=events[i],elapsed=t-e.t;
  if(elapsed<0||elapsed>=1.45)continue;
  const station=v.crew?.helper?.station===1?'POT':'WOK';
  const staff= e.type==='waiter_pickup'||e.type==='waiter_return'?'waiter':
    e.type==='started'&&e.station===station||e.type==='plate_ready'&&v.orders.some(o=>o.id===e.order&&RECIPES[o.recipeId]?.station===station)?'helper':null;
  if(staff==='helper'&&!helper||staff==='waiter'&&!waiter||!staff)continue;
  const phrases=staff==='helper'?
   e.type==='started'?['这锅我看着！',`火候交给${helperName}！`,'下一盘马上来！']:
   ['新鲜出锅！','出餐台准备好啦！','香喷喷的，出锅！']:

   phase:clampSpeech(elapsed/1.45)};
 }

 // A sparse two-person exchange, each employee takes turns once.
 const cycle=t%24,role=cycle<1.35?'helper':cycle>=2&&cycle<3.35?'waiter':null;
 if(!role)return null;
 const offset=role==='helper'?0:2;
 const lines=role==='helper'?[`${waiterName}，下一盘准备好！`,'我看火，你看客人！','端菜交给你啦！']:
 ['收到，我去送餐！','放心，桌边我照顾！',`盘子我来拿，${helperName}！`];
 const index=Math.floor(t/24)%lines.length;

  text:lines[index],phase:clampSpeech((cycle-offset)/1.35)};
}

 c.save();c.beginPath();c.rect(0,0,w,h);c.clip();
 const floor=c.createLinearGradient(0,0,w,h);
 floor.addColorStop(0,HM.grassLight);floor.addColorStop(.45,HM.grass);floor.addColorStop(1,HM.grassShade);
 c.fillStyle=floor;c.fillRect(0,0,w,h);
 // Eleven broad light pools are grouped by terrain purpose rather than tile.
 for(let i=0;i<11;i++){
  const k=hybridMeadowHash(seed+i*1079),o=f.obstacles[i%Math.max(1,f.obstacles.length)];
  const shade=i%3!==0,x=shade&&o?o.x+.75:.4+(k%114)/10,
   y=shade&&o?o.y+.9:.3+((k>>>9)%150)/10,r=shade?1.45+((k>>>21)%12)/10:2.8+((k>>>21)%13)/10;

  glaze.addColorStop(1,shade?'#244e4800':'#d1d3a900');
  c.fillStyle=glaze;c.fillRect(x-r,y-r,r*2,r*2);
 }
 hybridMeadowTrail(c,plan,true);
 const detail=buildHybridMeadowDetailPlan(f,plan);
 for(const g of detail.groups){
  if(g.category==='edge'){
   // Soil and grass touch the outer rim; the center line stays uninterrupted.
   const nearest=[...plan.trail].map(key=>{const [x,y]=key.split(',').map(Number);return {x:x+.5,y:y+.5};})
    .sort((a,b)=>Math.hypot(a.x-g.x,a.y-g.y)-Math.hypot(b.x-g.x,b.y-g.y))[0];
   if(nearest){
    const dx=nearest.x-g.x,dy=nearest.y-g.y,n=Math.hypot(dx,dy)||1;
    c.save();c.globalAlpha=.24;c.lineCap='round';c.lineWidth=.11;c.strokeStyle=HM.grass;
    c.beginPath();c.moveTo(g.x,g.y);c.quadraticCurveTo(g.x+dx/n*.16,g.y+dy/n*.16,g.x+dx/n*.25,g.y+dy/n*.25);c.stroke();
    c.globalAlpha=.19;c.lineWidth=.035;c.strokeStyle=HM.trailRim;c.beginPath();
    c.moveTo(g.x-dy/n*.17,g.y+dx/n*.17);c.quadraticCurveTo(g.x+dx/n*.18,g.y+dy/n*.18,g.x+dy/n*.13,g.y-dx/n*.13);c.stroke();c.restore();
   }
  }

 }

function drawHybridMeadowGround(c,f){

 let images=hybridMeadowGroundCache.get(f);
 if(!images){images=new Map();hybridMeadowGroundCache.set(f,images);}
 let image=images.get(mode);
 if(!image){
  image=document.createElement('canvas');
  image.width=plan.width*64;image.height=plan.height*64;
  const g=image.getContext('2d',{alpha:false});
  g.scale(64,64);g.imageSmoothingEnabled=true;
  if(mode==='hybrid-e0')hybridMeadowGroundE0Into(g,f,plan);

 c.strokeStyle=color;c.lineWidth=radius*.10;
 for(let i=0;i<5;i++){const a=i*Math.PI*2/5+.35;
  c.beginPath();c.moveTo(Math.cos(a)*radius*.34,Math.sin(a)*radius*.34);
  c.quadraticCurveTo(Math.cos(a+.08)*radius*.7,Math.sin(a+.08)*radius*.7,Math.cos(a)*radius*(.7+p*.4),Math.sin(a)*radius*(.7+p*.4));c.stroke();

function drawFieldSwipe(c,f){

 let end=0;
 return events.map(e=>{
  const start=Math.max(e.t,end),duration=e.type==='ordered'?3.4:3.8;
  end=start+duration;
  return {start,end,type:e.type,table:e.table??v.orders?.find(o=>o.id===e.order)?.tableId??0};
 });
}
function waiterStagePosition(v,t,w,h){
 const home={x:w*.5,y:h*.79};
 const job=waiterJobs(v).find(j=>t>=j.start&&t<j.end);
 if(!job)return {...home,moving:false};
 const a=(t-job.start)/(job.end-job.start);
 const p=a<.43?smooth(a/.43):a>.63?1-smooth((a-.63)/.37):1;
 const side=job.table===0?-1:1;
 const target={x:home.x+side*w*.10,y:h*.718};
 return {x:lerp(home.x,target.x,p),y:lerp(home.y,target.y,p),moving:p>.01&&p<.99,action:job.type};
}

// Compact speech is painted INSIDE the one restaurant canvas. It has no DOM
// hit target, cannot intercept the joystick, and never covers either table.

const speechClamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function speechRectOverlap(a,b,pad=0){
 return Math.max(0,Math.min(a.x+a.width+pad,b.x+b.width+pad)-Math.max(a.x-pad,b.x-pad))*
        Math.max(0,Math.min(a.y+a.height+pad,b.y+b.height+pad)-Math.max(a.y-pad,b.y-pad));
}
// Deterministic speech placement for one Canvas frame. Guest priority and
// actual head positions drive layout; staff chatter uses only spare space.
// Returns a map of cue IDs, not persistent game state or interactive overlays.
function placeRestaurantSpeech(guestCues,workerCue,actors,w,h){
 const byId=new Map(actors.map(a=>[a.id,a])),placed=[],result=new Map();
 const items=[...(guestCues||[]).map(cue=>({cue,actor:byId.get(cue.id),staff:false})),
   ...(workerCue?[{cue:workerCue,actor:byId.get(workerCue.staffRole),staff:true}]:[])]
   .filter(x=>x.actor&&x.cue.text)
   .sort((a,b)=>(b.cue.priority||0)-(a.cue.priority||0)||Number(a.staff)-Number(b.staff));
 const safeTop=h*.205+4,safeBottom=h*.90,margin=7;
 // A speech bubble belongs to its speaker. Never trade that identity away to
 // avoid scenery: previous collision scoring teleported bubbles below cooks
 // and towards neighbouring dining tables on narrow phones.
 for(const {cue,actor,staff} of items){
  const lines=diningBubbleLines(cue.text,staff?12:16);
  const font=staff?10:11,height=lines.length>1?(staff?35:40):(staff?27:29);
  const width=Math.min(w-2*margin,Math.min(staff?116:129,Math.max(64,
    Math.max(...lines.map(line=>Array.from(line).length))*font+18)));
  const ax=actor.x*w,ay=actor.y*h;
  // Pixel actors are drawn with their feet at (ax,ay); the tip should point
  // to the forehead, not to the table, the feet or the order emoji.
  const tipX=ax,tipY=ay-24;
  const originY=tipY-height-12;
  const offsets=staff?[0,17,-17,29,-29]:[0,14,-14,27,-27];
  let best=null;
  for(const [i,off] of offsets.entries()){
   const left=speechClamp(ax-width/2+off,margin,w-width-margin);
   const top=speechClamp(originY,safeTop,Math.max(safeTop,safeBottom-height));
   const box={x:left,y:top,width,height};
   const peer=placed.reduce((sum,p)=>sum+speechRectOverlap(box,p,4),0);
   const coversOtherHeads=actors.filter(other=>other!==actor).reduce((sum,other)=>
    sum+speechRectOverlap(box,{x:other.x*w-11,y:other.y*h-30,width:22,height:29},2),0);
   const tail=Math.hypot(speechClamp(tipX,left+9,left+width-9)-tipX,tipY-(top+height));
   const penalty=peer*120+ coversOtherHeads*38+ Math.max(0,tail-30)*90+
     Math.abs(off)*1.5+Math.abs(top-originY)*.8+i*.5;
   if(!best||penalty<best.penalty)best={...box,penalty};
  }
  // Suppress low-value worker chatter rather than let it cover a customer,
  // the hero or migrate into an unrelated corner of the restaurant.
  if(!best)continue;
  const overlap=placed.reduce((sum,p)=>sum+speechRectOverlap(best,p,3),0);
  if(staff&&overlap>0)continue;
  const baseX=speechClamp(tipX,best.x+9,best.x+best.width-9);
  const baseY=best.y+best.height;
  if(staff&&Math.hypot(baseX-tipX,baseY-tipY)>40)continue;
  placed.push(best);
  result.set(cue.id,{...best,lines,baseX,baseY,tipX,tipY,staff,dir:'above'});
 }
 return result;
}
function drawSpeechCard(c,cue,p,staff=false){
 if(!p)return;
 const negative=!staff&&(cue.kind==='upset'||cue.kind==='review'&&['late','bad','quality','taste'].includes(cue.reviewType));
 const fill=staff?'#dcebd6':negative?'#ffe2ca':cue.kind==='review'?'#f5e9c8':'#f2eed3';
 const stroke=staff?'#5c846c':negative?'#d59775':'#b7a67c';
 c.save();c.globalAlpha=Math.min(staff ? .92 : .94,speechOpacity(cue));
 c.fillStyle=fill;c.strokeStyle=stroke;c.lineWidth=1.1;
 c.beginPath();c.roundRect(p.x,p.y,p.width,p.height,staff?7:9);c.fill();c.stroke();
 // A short pointer connects the bubble edge with the ACTUAL actor head.
 const dx=p.tipX-p.baseX,dy=p.tipY-p.baseY,dist=Math.hypot(dx,dy)||1;
 if(dist<=42&&p.tipY>=p.baseY){
  const nx=-dy/dist*3.6,ny=dx/dist*3.6;
  c.fillStyle=fill;c.beginPath();c.moveTo(p.baseX+nx,p.baseY+ny);
  c.lineTo(p.baseX-nx,p.baseY-ny);c.lineTo(p.tipX,p.tipY);c.closePath();c.fill();
  c.strokeStyle=stroke;c.beginPath();c.moveTo(p.baseX+nx,p.baseY+ny);
  c.lineTo(p.tipX,p.tipY);c.lineTo(p.baseX-nx,p.baseY-ny);c.stroke();
 }
 for(let i=0;i<p.lines.length;i++)
  text(c,p.lines[i],p.x+p.width/2,p.y+(p.lines.length===1?p.height/2:(staff?10:12)+i*(staff?14:15)),
       staff?'#2f493e':negative?'#7b4237':'#394234',staff?10:11);
 c.restore();
}
function drawGuestSpeech077(c,cue,actor,w,h){

}
function drawStaffSpeech078(c,cue,actor,w,h){

// Short, quiet talk follows an actual guest who is visibly waiting OUTSIDE.
// The doorway clips this to its own window. Never adds an interaction layer.
function drawOutdoorQueueChatter(c,queue,t,L,T,W,H){
 const cue=selectOutdoorQueueSpeech(queue,t);
 if(!cue||W<118||H<58)return null;
 const slot=queue.slice(0,4).findIndex(o=>o.id===cue.orderId);
 if(slot<0)return null;
 const actorX=L+W*(.20+slot*.205),actorY=T+H*.77;
 const glyphs=Array.from(cue.text);
 const words=glyphs.length>10?glyphs.slice(0,9).join('')+'…':glyphs.join('');
 const font=H<85?8:9;
 const width=Math.min(W-12,Math.max(45,Math.ceil(Array.from(words).length*font+14)));
 const height=H<85?20:23;
 const X=speechClamp(actorX-width*.5,L+5,L+W-width-5);
 // The status bar occupies the top 28 px. A small gap is always preserved.
 const Y=T+Math.min(Math.max(31,H*.32),H-height-4);
 const urgent=cue.kind==='urgent';
 c.save();c.globalAlpha=Math.min(.93,speechOpacity(cue));
 c.fillStyle=urgent?'#ffdfc4':'#eff3d9';c.strokeStyle=urgent?'#ca966c':'#83a18a';
 c.lineWidth=1;
 c.beginPath();c.roundRect(X,Y,width,height,6);c.fill();c.stroke();
 const headY=actorY-19,base=speechClamp(actorX,X+9,X+width-9);
 if(headY>Y+height&&headY-(Y+height)<24){
  c.beginPath();c.moveTo(base-3,Y+height-1);c.lineTo(base+3,Y+height-1);
  c.lineTo(actorX,headY);c.closePath();c.fill();
 }
 text(c,words,X+width/2,Y+height/2,urgent?'#77402f':'#395248',font);
 c.restore();
 return cue.orderId;
}

// The simulation and visual rendering are decoupled: canvas runs each frame,
// the rules tick at a fixed delta, and HTML overlays rerender only on decisions.
function analogAxis(){let x=stick.x,y=stick.y;for(const key of keys){if(['ArrowLeft','a'].includes(key))x-=1;if(['ArrowRight','d'].includes(key))x+=1;if(['ArrowUp','w'].includes(key))y-=1;if(['ArrowDown','s'].includes(key))y+=1;}const l=Math.hypot(x,y);return l>1?[x/l,y/l]:[x,y]}
// Render progress derives from authoritative service seconds; a paused night

function restaurantSimTime(now){const v=game.service;if(!v)return gameClock;if(v.walkable)return v.time+(v.clockAccumulator||0);if(v.paused||v.breakAt||v.done)return v.time;return v.time+Math.max(0,Math.min(1,(now-(serviceTickAt||now))/750));}

// Safari selection may start on the *lower dock* when a thumb lands beside
// its instruction text. Both the playfield and the unused dock background are
// gameplay joystick surfaces, but none of their actionable buttons are.
function fieldGestureSurface(target){
 if(!target?.closest)return false;
 if(target.closest('button,select,input,textarea,[contenteditable="true"],.field-event,.sheet,.modal'))return false;
 return !!target.closest('.action-forest,.action-field-dock');
}
function playingFieldGestures(){return game.phase==='field'&&!!game.field?.action&&!game.field.finished&&game.field.segmentStatus!=='choice'&&!overlay;}
function clearThumbSelection(){
 const selected=window.getSelection?.();
 if(selected&&!selected.isCollapsed)selected.removeAllRanges();
}
// Only cancel iOS native gestures while the expedition joystick owns a finger.
// Never steal touches from the two bottom action buttons or a dialog.
app.addEventListener('touchstart',e=>{
 if(!playingFieldGestures()||!fieldGestureSurface(e.target))return;
 if(e.cancelable)e.preventDefault();
 clearThumbSelection();
},{passive:false});
app.addEventListener('touchmove',e=>{
 if(!playingFieldGestures()||stick.pointer===null)return;
 if(e.cancelable)e.preventDefault();
},{passive:false});
app.addEventListener('selectstart',e=>{
 if(game.phase==='field'&&game.field?.action&&!e.target.closest?.('input,textarea,[contenteditable="true"]'))e.preventDefault();
