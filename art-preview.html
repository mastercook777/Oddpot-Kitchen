<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eae8d8"><title>怪味食堂 · alpha.5 探索美术验证</title>
<link rel="stylesheet" href="./src/meadow_preview_e1.css?v=0.11.0-alpha.5">
</head><body><main class="shell">
<header><div><span class="eyebrow">ODDPOT KITCHEN · ART PLAYTEST</span><h1><select id="biome" aria-label="切换生态"><option value="herb_path">林地草甸</option><option value="glow_mushroom">幽光菌沼</option><option value="old_tree_edge">古树孢巢</option><option value="forest_garden">野蔬菜圃</option><option value="hot_spring_shallows">热泉浅滩</option><option value="steam_crack">蒸汽裂隙</option><option value="ember_edge">赤焰断坡</option><option value="steam_lake">矿泉晶池</option></select> <small>alpha.5</small></h1></div><button id="pause" aria-label="暂停试玩">暂停</button></header>
<nav class="modes" aria-label="同场景美术对比"><button data-mode="hybrid-e1" aria-pressed="true">Hybrid 新版</button><button data-mode="hybrid-e0" aria-pressed="false">旧草地</button><button data-mode="pixel" aria-pressed="false">全像素</button><button data-mode="legacy" aria-pressed="false">B1 对照</button></nav>
<section class="stage" aria-label="探索场景"><canvas id="scene" aria-label="可移动的香草小径场景"></canvas>
<div class="scene-hud"><span id="health"></span><span id="bag-count"></span></div>
<div id="overlay" hidden><strong id="overlay-title"></strong><p id="overlay-note"></p><div id="event-actions" hidden><button data-choice="trade">蘑菇换火椒</button><button data-choice="leave">离开</button></div><button id="again">重新试玩</button></div>
<div id="notice" aria-live="polite">左下摇杆移动 · 靠近食材自动采集</div></section>
<div class="inventory" id="inventory" aria-label="本次采集的食材">本次收获 · 尚未采集</div>
<section class="play-controls" aria-label="操作区"><div id="joystick" role="application" aria-label="移动摇杆；也可使用键盘方向键"><span class="joy-ring"></span><span id="knob"></span><small>移动</small></div><div class="right-controls"><div class="weapons" aria-label="测试锅具"><button data-weapon="WOK" aria-pressed="true">炒锅</button><button data-weapon="POT" aria-pressed="false">深锅</button></div><button id="skill">锅盖反击</button><small>自动普攻 · 空格释放技能</small></div></section>
<footer><select id="camera" aria-label="查看固定镜头"><option value="live">查看镜头…</option><option value="boss_spore">菌王试玩</option><option value="boss_ember">椒王试玩</option><option value="merchant">商人比例</option><option value="spawn">入口</option><option value="mid">道路中段</option><option value="tree">树石近景</option><option value="harvest">采集点</option></select><button id="reset">重置</button><button id="seed">换地图</button><span id="seed-label">种子 20261013</span></footer>
</main><script type="module" src="./src/meadow_preview_e1.js?v=0.11.0-alpha.5"></script></body></html>
