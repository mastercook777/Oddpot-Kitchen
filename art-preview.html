<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Oddpot Kitchen - Hybrid Meadow Canvas Art</title>
<style>
html,body{margin:0;min-height:100%;background:#18251c;color:#f0e9d5;font:14px/1.5 system-ui,-apple-system,sans-serif}
.shell{width:min(100vw,440px);margin:auto;padding:16px 12px 22px;box-sizing:border-box}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.tag{font-weight:600;font-size:11px;border:1px solid #9ac179;padding:3px 8px;border-radius:30px;color:#d9e8ae}
.sub{font-size:12px;color:#a4b99c;margin:7px 0 12px}
#scene{display:block;width:100%;height:600px;background:#63775d;image-rendering:pixelated;border:3px solid #526a49;border-radius:8px;box-sizing:border-box}
.controls{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
button{border:1px solid #73876b;background:#2f4833;color:#f0e9d5;border-radius:7px;padding:10px 12px;font-size:13px;cursor:pointer}
button[aria-pressed="true"]{background:#a3bd75;color:#1b2c20;font-weight:700}
.foot{font-size:12px;color:#b5c7aa}
</style></head><body>
<div class="shell">
 <div class="top"><span>ODDPOT · HERB PATH</span><span class="tag">HYBRID CANVAS ART</span></div>
 <div class="sub">Actual in-game Canvas render · feat/herb-path-pixel-art-slice</div>
 <canvas id="scene"></canvas>
 <div class="controls"><button data-view="harvest" aria-pressed="true">Hybrid · Gathering</button><button data-view="spawn" aria-pressed="false">Hybrid · Entrance</button><button data-view="pixel" aria-pressed="false">Pixel Before</button><button data-view="original" aria-pressed="false">B1 Before</button></div>
 <div class="foot">Real drawField output, not concept art. Painted Canvas terrain + pixel sprites. Compare exactly the same map in Hybrid / Pixel / B1 legacy modes. Gameplay HUD not shown.</div>
</div>
<script type="module">
import {newGame,enterField} from './src/engine.js';
import {startActionField} from './src/field_v04.js';
import {fieldTilePath} from './src/field_rules_v011a.js';
import {drawField} from './src/scenes_v04.js';
const canvas=document.getElementById('scene');
function makeState(){
 const s=newGame(20261013);
 s.phase='field';
 enterField(s,'safe');
 startActionField(s);
 return s;
}
let s=makeState();
function chooseView(name){
 s=makeState();
 const f=s.field;
 if(name==='original') f.biome.zoneId='herb_path_original_comparison';
 if(name==='pixel') f.artPreviewMode='pixel';
 if(name==='harvest'||name==='pixel'||name==='original'){
  const node=f.nodes.find(n=>n.key==='target');
  const route=fieldTilePath(f,f.spawn,{x:node.x+.5,y:node.y+.5},{avoidHazards:true});
  const step=route[Math.max(0,Math.floor(route.length*.70))];
  if(step) f.pos={x:step.x,y:step.y};
 }
 drawField(canvas,s,4.3);
 document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===name?'true':'false'));
 window.__oddpotPreview={view:name,worldVersion:f.worldVersion,style:f.biome.zoneId,rendered:true};
}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>chooseView(b.dataset.view)));
chooseView(new URLSearchParams(location.search).get('view')||'harvest');
</script></body></html>
