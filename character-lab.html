<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Oddpot · Character Lab</title><style>
*{box-sizing:border-box}body{margin:0;background:#202526;color:#efe2ca;font:14px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:16px 12px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:22px;margin:4px 0}a{color:#e4bd87}small{color:#c6b99f}p{line-height:1.6;color:#c6b99f}.control{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0;align-items:center}button,select{background:#363e3d;border:1px solid #706d5e;color:#eee0c8;border-radius:6px;padding:9px;font:inherit;min-height:42px}button[aria-pressed=true]{background:#e6bd80;color:#29251e}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}article{background:#2a302f;border:1px solid #55574e;border-radius:8px;overflow:hidden;min-width:0;padding:7px}article h2{font-size:14px;margin:7px 0}article p{font-size:12px;min-height:38px;margin:4px 0 8px}.stage{height:clamp(126px,36vw,250px);display:grid;place-items:center;background:radial-gradient(ellipse at 50% 65%,#6b6952,#303b37 75%);overflow:hidden;border-radius:4px}.stage canvas{image-rendering:pixelated;max-width:100%;height:auto;width:100%;display:block}article a{font-size:12px;display:block;padding:6px 0}#frame{font-variant-numeric:tabular-nums} @media(min-width:600px){article{padding:12px}} </style></head><body><main><header><div><small>ODDPOT / v0.16-X.3</small><h1>Character Lab</h1></div><a href="./visual-lab.html?v=x3">环境实验室</a></header><p>三种主厨造型，共用白帽、蓝衣、红领巾与围裙。同步播放方便比较；下方入口可进入实际 Canvas HD 场景走动。</p>
<div class="control" aria-label="方向"><button data-dir="front" aria-pressed="true">正面</button><button data-dir="back" aria-pressed="false">背面</button><button data-dir="left" aria-pressed="false">左侧</button><button data-dir="right" aria-pressed="false">右侧</button></div>
<div class="control" aria-label="动作"><button data-action="idle" aria-pressed="true">待机</button><button data-action="walk" aria-pressed="false">行走</button><button id="pause" aria-pressed="false">暂停</button><button id="step">下一帧</button><label>倍率 <select id="zoom"><option value="2">2×</option><option value="3" selected>3×</option><option value="4">4×</option></select></label><small id="frame">1 / 4</small></div>
<section id="variants"></section><p>本轮造型实验不改变正式游戏或存档。动画由原创像素姿态组成，尚未制作端菜、料理及战斗动作。</p></main><script type="module" src="./character-lab.js?v=x3"></script></body></html>
