</style></head><body><main><a href="./?render=3d">返回怪味食堂</a><h1>Hearthcraft · 怪味食堂图标工坊</h1><p>Z2a3 实际游戏资产。每张卡片从左到右为旧线稿 24px、新美术 17 / 24 / 36px，下方为同一分层源通过 Canvas 绘制的20px状态样张。无需登录、不读写存档。</p><div class="swatches"><span><i style="background:#e9b85d"></i>黄铜</span><span><i style="background:#f6e3b8"></i>陶白</span><span><i style="background:#578a75"></i>青玉</span><span><i style="background:#b65c42"></i>火焰</span></div><div id="gallery"></div><footer>实际显示尺寸优先；36px 只用于技能或较大按钮。</footer></main><script type="module">
