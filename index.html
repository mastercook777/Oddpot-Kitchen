<script type="module">
const build='v0.16-Z.2c5',requested3d=new URLSearchParams(location.search).get('render')==='3d';

function refreshLabel(){
 const d=document.documentElement.dataset,active=!!document.querySelector('canvas[data-guest-count],canvas[data-oddpot-forest="3d"],canvas[data-oddpot-research="3d"],.z2c2-map[data-z2c3-active] canvas[data-oddpot-departure="landscape"]');

 label.textContent=build+' · '+mode;globalThis.__oddpotBuild.renderer=mode;retry3d.hidden=!requested3d||active||(!failed&&!Object.keys(globalThis.__oddpotBuild.sceneErrors).length);

 ['diner',()=>import('./src/three_y2_diner.js?v=z2b'),()=>import('./src/three_y2_diner.js?v=z2b-r1'),'enableY2'],

 for(const [name,load,retryLoad,enable] of rendererSpecs){
  if(modulesReady.has(name)||loadingModules.has(name))continue;

  (async()=>{try{let mod;try{mod=await load();}catch(e){await new Promise(r=>setTimeout(r,900));mod=await retryLoad();}
   mod[enable]();modulesReady.add(name);rendererReady=modulesReady.size===rendererSpecs.length;delete globalThis.__oddpotBuild.sceneErrors[name];
