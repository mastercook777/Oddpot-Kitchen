name: Y4c 3D scene smoke
on:
  pull_request:
    paths: ['src/**','scripts/check-y4c-3d.mjs','.github/workflows/y4c-3d.yml','index.html']
  push:
    branches: ['main']
permissions: {contents: read}
jobs:
  webgl-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1 three@0.170.0
      - run: node scripts/check-y4c-3d.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oddpot-y4c-3d
          path: docs/screenshots/y4c-3d/*.png
