name: Herb Path pixel preview screenshots
on:
  push:
    branches:
      - feat/herb-path-pixel-art-slice
    paths:
      - 'art-preview.html'
      - 'src/**'
      - 'scripts/capture-herb-preview.mjs'
      - '.github/workflows/herb-preview-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install game dependencies
        run: npm ci
      - name: Install screenshot driver (branch-only, no lockfile changes)
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Render real gameplay field Canvas and capture mobile screenshots
        run: node scripts/capture-herb-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: herb-path-mobile-canvas-screenshots
          path: docs/screenshots/*.png
      - name: Commit pictures only to preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if ! git diff --staged --quiet; then
            git commit -m "preview: capture actual herb-path mobile Canvas screenshots [skip ci]"
            git push origin HEAD:feat/herb-path-pixel-art-slice
          fi
