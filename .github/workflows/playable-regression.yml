name: Oddpot playable regression
on:
  push:
    branches:
      - main
      - feature/v0.9-fantasy-diner-growth
      - feature/v0.9.1-compact-tavern-layout
      - feature/v0.9.2-seated-guests-doorway-window
      - feature/v0.9.3-home-cleanup-daily-supply
      - fix/v0.9.4-market-legibility
      - feature/v0.9.5-preopen-inventory-check
      - feature/v0.10-rare-hidden-menu
      - feature/v0.10.1-menu-stock-ux
      - feature/v0.10.2-guest-compendium
      - feature/v0.10.3-research-review-heat
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  node-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Generate offline playable
        run: python scripts/build-standalone.py
      - name: Test gameplay rules
        run: npm test
      - name: Build web assets
        run: npm run build
      - name: Commit rebuilt offline bundle for this feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/v0.10.3-research-review-heat'
        run: |
          if ! git diff --quiet -- standalone.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add standalone.html
            git commit -m "build(v0.9): synchronize offline gameplay bundle"
            git push origin HEAD:feature/v0.10.3-research-review-heat
          fi
