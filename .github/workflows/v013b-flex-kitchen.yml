name: v0.13-B cookware-wide mastery and cook dispatch
on:
  pull_request:
    paths: ['src/**','tests/**','scripts/**','index.html','.github/workflows/v013b-flex-kitchen.yml']
  push:
    branches: ['feature/v013b-shared-cookware-crew-dispatch-20261015','main']
permissions: {contents: read}
jobs:
  shared-kitchen:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and node deps
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - run: npm test
      - run: python scripts/build-standalone.py
      - run: node scripts/simulate-staffed-third-kitchen-v013a.mjs --runs 80
      - run: node scripts/check-v013a-staffed-third-kitchen-browser.mjs
      - run: node scripts/check-v013b-shared-cookware-crew-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v013b-kitchen-worker-mobile
          path: docs/screenshots/v013b-workforce/*.png
