name: v0.12-D employee appearance mobile browser
on:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/v012d-crew-art-browser.yml'
  push:
    branches:
      - feature/v012d-crew-visual-evolution-20261015
      - main
permissions:
  contents: read
jobs:
  employee-art-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chrome test dependencies and Chinese fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Generate offline release
        run: python scripts/build-standalone.py
      - name: Verify both employees at three ranks, shift renderer and standalone
        run: node scripts/check-v012d-crew-art-browser.mjs
      - name: Store employee progression screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v012d-employee-art-chrome
          path: docs/screenshots/v012d-crew-art/*.png
