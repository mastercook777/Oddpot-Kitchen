name: v0.13-E four real market offers mobile
on:
  pull_request:
    paths: ['src/**','tests/**','scripts/**','index.html','standalone.html','.github/workflows/v013e-market-four-visible.yml']
  push:
    branches: ['fix/v013e-market-four-visible-offers','main']
permissions: {contents: read}
jobs:
  four-market-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser and node deps
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - run: npm test
      - run: npm run build
      - run: python scripts/build-standalone.py
      - run: node scripts/check-v013e-market-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v013e-actual-four-market-mobile
          path: docs/screenshots/v013e-market-four/*.png
