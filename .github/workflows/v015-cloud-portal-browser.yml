name: v0.15 third star and Cloud Harbor
on:
  pull_request:
    paths: ['src/**','scripts/**','index.html','standalone.html','docs/V0.15*','.github/workflows/v015-cloud-portal-browser.yml']
  push:
    branches: ['main']
permissions: {contents: read}
jobs:
  cloud-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build browser and offline versions
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          python scripts/build-standalone.py
      - name: Check one joint player journey at three phone widths
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          node scripts/check-v015-cloud-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oddpot-v015-cloud
          path: docs/screenshots/v015-cloud/*.png
