name: v0.12-C integrated restaurant mobile browser
on:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/v012c-management-browser.yml'
  push:
    branches:
      - feature/v012c-management-full-loop-20261015
      - main
permissions:
  contents: read
jobs:
  management-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tools and Chrome test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Generate current playable single-file edition
        run: python scripts/build-standalone.py
      - name: Inspect staff/marketing interaction in real Chrome
        run: node scripts/check-v012c-management-browser.mjs
      - name: Upload proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v012c-real-chrome-screenshots
          path: docs/screenshots/v012c-browser/*.png
