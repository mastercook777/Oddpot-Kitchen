name: First star mobile browser check
on:
  push:
    branches: [feature/v0.12a-first-star]
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'standalone.html'
      - 'scripts/check-v012a-browser.mjs'
      - '.github/workflows/v012a-restaurant-browser.yml'
permissions:
  contents: read
jobs:
  restaurant-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install fonts and browser test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify Chrome mobile flows and screenshots
        run: node scripts/check-v012a-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-star-mobile-browser
          path: docs/screenshots/v012a-browser/*.png
