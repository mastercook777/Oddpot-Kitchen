name: CB01 cooking build workshop
on: [pull_request, workflow_dispatch]
jobs:
  cb01:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: node --test tests/cooking_build_v2.test.js
      - run: npm install --no-save --package-lock=false playwright@1.56.1 three@0.170.0
      - run: node scripts/check-cooking-build-workshop.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cb01-workshop-screenshots
          path: docs/screenshots/cb01/
          if-no-files-found: warn
