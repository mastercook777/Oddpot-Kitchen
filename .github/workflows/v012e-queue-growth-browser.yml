name: v0.12-E queue and promotion mobile
on:
  pull_request:
    paths:
      - 'src/**'
      - 'index.html'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/v012e-queue-growth-browser.yml'
  push:
    branches:
      - feature/v012e-queue-growth-20261015
      - main
permissions:
  contents: read
jobs:
  real-restaurant-queue-and-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Chrome and game build tools
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Generate offline edition
        run: python scripts/build-standalone.py
      - name: Real engine 3/4 table economics, 80 seeds per case
        run: node scripts/simulate-management-v012e.mjs --runs 80
      - name: Three viewport real Chrome daily promotion and queue
        run: node scripts/check-v012e-queue-growth-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v012e-queue-growth-phone-screens
          path: docs/screenshots/v012e-queue-growth/*.png
