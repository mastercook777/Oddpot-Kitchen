name: v0.13-J first loop mobile browser
on:
  pull_request:
    paths: ['src/**','tests/**','scripts/**','index.html','standalone.html','docs/V0.13J_*','.github/workflows/v013j-first-loop.yml']
  push:
    branches: ['main']
permissions: {contents: read}
jobs:
  first-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Install, test and build
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm test
          npm run build
          python scripts/build-standalone.py
      - name: Chrome 320 / 375 / 390, old save and offline
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          node scripts/check-v013j-first-loop-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oddpot-v013j-first-loop
          path: docs/screenshots/v013j-first-loop/*.png
