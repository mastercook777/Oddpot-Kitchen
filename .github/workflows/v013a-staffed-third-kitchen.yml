name: v0.13-A staffed third kitchen production
on:
  pull_request:
    paths: ['src/**','scripts/**','tests/**','index.html','.github/workflows/v013a-staffed-third-kitchen.yml']
  push:
    branches: ['feature/v013a-third-kitchen-and-crew-20261015','main']
permissions:
  contents: read
jobs:
  staffed-third-kitchen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install game and browser deps
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: All actual gameplay tests
        run: npm test
      - name: Generate offline file
        run: python scripts/build-standalone.py
      - name: Third station actual 80-seed economics
        run: node scripts/simulate-staffed-third-kitchen-v013a.mjs --runs 80
      - name: Three viewport browser staffed expansion and offline
        run: node scripts/check-v013a-staffed-third-kitchen-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v013a-staffed-third-kitchen-screens
          path: docs/screenshots/v013a-staffed-kitchen/*.png
