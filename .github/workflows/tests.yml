name: Core gameplay tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend build tools
        run: npm install --no-audit --no-fund
      - name: Run deterministic game rules tests and check production bundle
        run: npm test
