name: Z2e full-day game UI workshop
on:
  pull_request:
  workflow_dispatch:
jobs:
  workshop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.56.1 three@0.170.0
      - run: node scripts/check-game-ui-workshop-v2.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: z2e-workshop-v2-screenshots
          path: docs/screenshots/z2e-workshop-v2/
