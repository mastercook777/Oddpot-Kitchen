name: v0.14-C grill mobile journey
on:
  pull_request:
    paths: ['src/**','scripts/**','index.html','standalone.html','.github/workflows/v014b-grill-browser.yml']
  push:
    branches: ['main']
permissions: {contents: read}
jobs:
  grill-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Build web and offline
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build
          python scripts/build-standalone.py
      - name: Check grill at three mobile sizes
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          node scripts/check-v014b-grill-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oddpot-v014c-grill
          path: docs/screenshots/v014c-grill/*.png
