name: Exploration H mobile browser check
on:
  push:
    branches: [feature/v0.11-h-attack-feel]
  pull_request:
    paths:
      - 'src/field_hit_response_v011h.js'
      - 'scripts/check-h-browser.mjs'
      - '.github/workflows/h-combat-browser.yml'
permissions:
  contents: read
jobs:
  combat-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install fonts and test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          npm install --no-package-lock --no-audit --no-fund
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify actual Chrome screenshots and multitouch
        run: node scripts/check-h-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h-combat-mobile-browser
          path: docs/screenshots/h-browser/*.png
